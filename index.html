<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المحادثات الآمن</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* يمكنك إضافة تنسيقات الـ CSS الخاصة بك هنا */
    body { font-family: sans-serif; margin: 0; padding: 0; background-color: #121212; color: #fff; }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }
    .chat-box { height: 300px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
    .msg-group { margin-bottom: 8px; }
    .msg-group.me { text-align: left; }
    .msg-group.other { text-align: right; }
    .bubble { display: inline-block; padding: 8px 12px; background: #333; border-radius: 8px; }
    .msg-group.me .bubble { background: #b71c1c; }
    #error-box { color: #ff5252; display: none; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div id="auth-screen" class="screen active">
    <button id="back-btn" onclick="goBackToPasscode()" style="display:none;"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
    <i id="auth-icon" class="fa-solid fa-lock"></i>
    <h2 id="auth-title">رمز الأمان / Security Code</h2>
    <p id="auth-desc">أدخل رمز الأمان للوصول إلى النظام</p>
    
    <div id="error-box"></div>

    <div id="wrap-passcode">
      <input type="password" id="input-passcode" placeholder="رمز الأمان">
    </div>

    <div id="wrap-username" style="display:none;">
      <input type="text" id="input-username" placeholder="اسم المستخدم">
    </div>

    <div id="wrap-password" style="display:none;">
      <input type="password" id="input-password" placeholder="كلمة المرور">
    </div>

    <br>
    <button id="auth-btn" onclick="handleAuthAction()">متابعة / Continue</button>

    <br><br>
    <a id="auth-switch-link" href="#" onclick="switchToRegister()" style="display:none;">ليس لديك حساب؟ إنشاء حساب جديد</a>
    <a id="auth-login-link" href="#" onclick="switchToLogin()" style="display:none;">لديك حساب بالفعل؟ تسجيل الدخول</a>
  </div>

  <div id="home-screen" class="screen">
    <h2 id="welcome-text">مرحباً</h2>
    <div>
      <input type="text" id="search-username" placeholder="ابحث عن اسم المستخدم...">
      <button onclick="startNewChat()">بحث / Search</button>
    </div>
    <h3>المحادثات الأخيرة</h3>
    <div id="chat-list"></div>
  </div>

  <div id="chat-screen" class="screen">
    <button onclick="goHome()"><i class="fa-solid fa-arrow-right"></i> رجوع للرئيسية</button>
    <h3 id="chat-with-name">المحادثة</h3>
    <div id="chat-box" class="chat-box"></div>
    <div>
      <input type="text" id="message-input" placeholder="اكتب رسالتك..." oninput="toggleSendBtn()">
      <button id="send-btn" onclick="sendMessage()" style="display:none;">إرسال</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2dnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';
    
    let _supabase = null;
    function getSupabase() {
      if (!_supabase && window.supabase) {
        _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return _supabase;
    }

    let currentUser = "";
    let currentAccountData = null;
    let heartbeatInterval = null;
    let currentChatFriend = "";
    let messageSubscription = null;
    let userStatusSubscription = null;
    let authStep = 'passcode'; 

    const authScreen = document.getElementById('auth-screen');
    const homeScreen = document.getElementById('home-screen');
    const chatScreen = document.getElementById('chat-screen');
    const chatBox = document.getElementById('chat-box');
    const chatList = document.getElementById('chat-list');
    const msgInput = document.getElementById('message-input');
    const errorBox = document.getElementById('error-box');
    const backBtn = document.getElementById('back-btn');

    function showError(msg) { 
      errorBox.innerText = msg; 
      errorBox.style.display = 'block'; 
    }
    
    function hideError() { 
      errorBox.innerText = ''; 
      errorBox.style.display = 'none'; 
    }

    function updateAuthUI() {
      hideError();
      const wrapPasscode = document.getElementById('wrap-passcode');
      const wrapUser = document.getElementById('wrap-username');
      const wrapPass = document.getElementById('wrap-password');
      const switchLink = document.getElementById('auth-switch-link');
      const loginLink = document.getElementById('auth-login-link');
      const authTitle = document.getElementById('auth-title');
      const authDesc = document.getElementById('auth-desc');
      const authIcon = document.getElementById('auth-icon');
      const authBtn = document.getElementById('auth-btn');

      if (authStep === 'passcode') {
        backBtn.style.display = "none";
        wrapPasscode.style.display = "block";
        wrapUser.style.display = "none";
        wrapPass.style.display = "none";
        switchLink.style.display = "none";
        loginLink.style.display = "none";
        authIcon.className = "fa-solid fa-lock";
        authTitle.innerText = "رمز الأمان / Security Code";
        authDesc.innerText = "أدخل رمز الأمان للوصول إلى النظام";
        authBtn.innerText = "متابعة / Continue";
      } else if (authStep === 'login') {
        backBtn.style.display = "inline-block";
        wrapPasscode.style.display = "none";
        wrapUser.style.display = "block";
        wrapPass.style.display = "block";
        switchLink.style.display = "block";
        loginLink.style.display = "none";
        authIcon.className = "fa-solid fa-right-to-bracket";
        authTitle.innerText = "تسجيل الدخول / Login";
        authDesc.innerText = "أدخل اسم المستخدم وكلمة المرور";
        authBtn.innerText = "دخول / Sign In";
      } else if (authStep === 'register') {
        backBtn.style.display = "inline-block";
        wrapPasscode.style.display = "none";
        wrapUser.style.display = "block";
        wrapPass.style.display = "block";
        switchLink.style.display = "none";
        loginLink.style.display = "block";
        authIcon.className = "fa-solid fa-user-plus";
        authTitle.innerText = "إنشاء حساب جديد / Register";
        authDesc.innerText = "أدخل بيانات الحساب لإرسال الطلب";
        authBtn.innerText = "إرسال الطلب / Submit Request";
      }
    }

    function switchToRegister() { authStep = 'register'; updateAuthUI(); }
    function switchToLogin() { authStep = 'login'; updateAuthUI(); }
    function goBackToPasscode() {
      authStep = 'passcode';
      document.getElementById('input-passcode').value = '';
      updateAuthUI();
    }

    function startUsageHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(async () => {
        if (document.visibilityState === 'visible' && currentAccountData) {
          const client = getSupabase();
          if (!client) return;
          const updatedSecs = (currentAccountData.usage_seconds || 0) + 5;
          currentAccountData.usage_seconds = updatedSecs;

          await client
            .from('account_requests')
            .update({ usage_seconds: updatedSecs })
            .eq('id', currentAccountData.id);
        }
      }, 5000);
    }

    async function handleAuthAction() {
      hideError();
      const client = getSupabase();
      if (!client) {
        showError("تعذر الاتصال بـ Supabase!");
        return;
      }

      if (authStep === 'passcode') {
        const passVal = document.getElementById('input-passcode').value.trim();
        if (passVal === '2411712') {
          switchToLogin();
        } else {
          showError("رمز الأمان غير صحيح!");
        }
      } else if (authStep === 'login') {
        const userVal = document.getElementById('input-username').value.trim();
        const passVal = document.getElementById('input-password').value.trim();

        if (!userVal || !passVal) {
          showError("يرجى ملء كافة الحقول!");
          return;
        }

        const { data, error } = await client
          .from('account_requests')
          .select('*')
          .eq('username', userVal)
          .eq('password', passVal)
          .maybeSingle();

        if (error) {
          showError("حدث خطأ: " + error.message);
          return;
        }

        if (!data) {
          showError("اسم المستخدم أو كلمة المرور غير صحيحة!");
          return;
        }

        if (data.status === 'rejected') {
          showError("your account is banned !");
          return;
        }

        if (data.status === 'pending') {
          showError("حسابك ما زال قيد الانتظار لم يتم قبوله بعد!");
          return;
        }

        if (data.status === 'approved') {
          currentUser = userVal;
          currentAccountData = data;
          document.getElementById('welcome-text').innerText = `مرحباً، ${currentUser}`;
          authScreen.classList.remove('active');
          homeScreen.classList.add('active');
          
          startUsageHeartbeat();
          loadRecentChats();

          // مراقبة البان اللحظي (Realtime Ban)
          if (userStatusSubscription) client.removeChannel(userStatusSubscription);
          
          userStatusSubscription = client
            .channel(`ban_listener_${data.id}`)
            .on('postgres_changes', {
              event: 'UPDATE',
              schema: 'public',
              table: 'account_requests',
              filter: `id=eq.${data.id}`
            }, payload => {
              if (payload.new.status === 'rejected') {
                alert("your account is banned !");
                window.location.reload();
              }
            })
            .subscribe();
        }

      } else if (authStep === 'register') {
        const userVal = document.getElementById('input-username').value.trim();
        const passVal = document.getElementById('input-password').value.trim();

        if (!userVal || !passVal) {
          showError("يرجى ملء كافة الحقول!");
          return;
        }

        const { error } = await client
          .from('account_requests')
          .insert([{ username: userVal, password: passVal, status: 'pending', usage_seconds: 0 }]);

        if (error) {
          showError(error.message || "حدث خطأ أثناء التسجيل.");
        } else {
          alert("تم إرسال طلب التسجيل بنجاح!");
          switchToLogin();
        }
      }
    }

    function goHome() {
      chatScreen.classList.remove('active');
      homeScreen.classList.add('active');
      currentChatFriend = "";
      if (messageSubscription && getSupabase()) {
        getSupabase().removeChannel(messageSubscription);
      }
      loadRecentChats();
    }

    async function loadRecentChats() {
      if (!currentUser) return;
      const client = getSupabase();
      if (!client) return;

      const { data, error } = await client
        .from('private_messages')
        .select('*')
        .or(`sender.eq.${currentUser},receiver.eq.${currentUser}`)
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        chatList.innerHTML = '<p style="color:#777;">لا توجد محادثات سابقة</p>';
        return;
      }

      let friends = new Set();
      data.forEach(msg => {
        if (msg.sender !== currentUser) friends.add(msg.sender);
        if (msg.receiver !== currentUser) friends.add(msg.receiver);
      });

      chatList.innerHTML = '';
      friends.forEach(friend => {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.style.cursor = 'pointer';
        div.onclick = () => openChat(friend);
        div.innerHTML = `<h4><i class="fa-solid fa-user"></i> ${friend}</h4>`;
        chatList.appendChild(div);
      });
    }

    // دالة البحث المحدثة والجديدة
    async function startNewChat() {
      const searchInput = document.getElementById('search-username');
      const friendName = searchInput.value.trim();
      
      if (!friendName) {
        alert("يرجى كتابة اسم المستخدم للبحث!");
        return;
      }

      if (friendName === currentUser) {
        alert("لا يمكنك بدء محادثة مع نفسك!");
        return;
      }

      const client = getSupabase();
      if (!client) return;

      // التأكد من أن المستخدم موجود ومقبول
      const { data, error } = await client
        .from('account_requests')
        .select('username')
        .eq('username', friendName)
        .eq('status', 'approved')
        .maybeSingle();

      if (error || !data) {
        alert("المستخدم غير موجود أو لم يتم قبول حسابه بعد!");
        return;
      }

      searchInput.value = '';
      openChat(friendName);
    }

    async function openChat(friendName) {
      currentChatFriend = friendName;
      document.getElementById('chat-with-name').innerText = currentChatFriend;
      homeScreen.classList.remove('active');
      chatScreen.classList.add('active');
      chatBox.innerHTML = '';

      const client = getSupabase();
      if (!client) return;

      const { data } = await client
        .from('private_messages')
        .select('*')
        .or(`and(sender.eq.${currentUser},receiver.eq.${currentChatFriend}),and(sender.eq.${currentChatFriend},receiver.eq.${currentUser})`)
        .order('created_at', { ascending: true });

      if (data && data.length > 0) {
        data.forEach(addMessageToScreen);
      } else {
        chatBox.innerHTML = `<div style="text-align:center; color:#888; margin-top:20px;">ابدأ المحادثة الآن مع ${currentChatFriend}!</div>`;
      }

      if (messageSubscription) client.removeChannel(messageSubscription);

      messageSubscription = client.channel(`private_chat_${currentUser}_${currentChatFriend}`)
        .on('postgres_changes', { 
          event: 'INSERT', 
          schema: 'public', 
          table: 'private_messages' 
        }, payload => {
          const m = payload.new;
          if ((m.sender === currentUser && m.receiver === currentChatFriend) || 
              (m.sender === currentChatFriend && m.receiver === currentUser)) {
            
            const placeholder = chatBox.querySelector('div');
            if (placeholder && placeholder.innerText.includes('ابدأ المحادثة')) {
              chatBox.innerHTML = '';
            }
            
            addMessageToScreen(m);
          }
        })
        .subscribe();
    }

    function addMessageToScreen(msg) {
      const isMe = msg.sender === currentUser;
      const group = document.createElement('div');
      group.className = `msg-group ${isMe ? 'me' : 'other'}`;
      
      const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      group.innerHTML = `
        <div class="bubble">${msg.content}</div>
        <br><small style="font-size:10px; color:#aaa;">${timeStr}</small>
      `;
      chatBox.appendChild(group);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !currentChatFriend) return;
      msgInput.value = '';
      toggleSendBtn();

      const client = getSupabase();
      if (!client) return;

      await client.from('private_messages').insert([
        { sender: currentUser, receiver: currentChatFriend, content: text }
      ]);
    }

    function toggleSendBtn() {
      const sendBtn = document.getElementById('send-btn');
      sendBtn.style.display = msgInput.value.trim().length > 0 ? 'inline-block' : 'none';
    }
  </script>
</body>
</html>
