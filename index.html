<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root[data-theme="crimson"] { --bg-main: #0b090a; --accent-color: #e63946; --card-bg: #161a1d; --text-main: #f8fafc; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); margin: 0; }
    .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }
    .auth-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .auth-input-wrapper { background: var(--card-bg); border: 1px solid #333; border-radius: 20px; padding: 10px 20px; width: 100%; max-width: 380px; margin-bottom: 12px; }
    .auth-input-wrapper input { width: 100%; background: transparent; border: none; color: #fff; outline: none; text-align: center; }
    .primary-btn { background: #e63946; color: white; border: none; padding: 15px; border-radius: 20px; width: 100%; max-width: 380px; cursor: pointer; font-weight: bold; }
    .error-msg { color: #ff4d4d; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <h2 id="auth-title">رمز الأمان</h2>
      <div class="error-msg" id="error-box"></div>
      
      <div class="auth-input-wrapper" id="wrap-passcode">
        <input type="password" id="input-passcode" placeholder="رمز الأمان...">
      </div>

      <div class="auth-input-wrapper" id="wrap-username" style="display: none;">
        <input type="text" id="input-username" placeholder="اسم المستخدم">
      </div>

      <div class="auth-input-wrapper" id="wrap-password" style="display: none;">
        <input type="password" id="input-password" placeholder="كلمة المرور">
      </div>

      <button class="primary-btn" id="auth-btn">متابعة / Continue</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2dnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';
    
    let authStep = 'passcode';

    // ربط الزرار برمجياً - هنا الحل!
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('auth-btn');
        if (btn) {
            btn.addEventListener('click', handleAuthAction);
            console.log("تم ربط الزرار بنجاح!");
        } else {
            console.error("الزرار غير موجود في الصفحة!");
        }
    });

    async function handleAuthAction() {
      console.log("تم الضغط على الزرار!"); // لو الكلمة دي ظهرت في الكونسول، يبقى الزرار شغال
      const errorBox = document.getElementById('error-box');
      errorBox.style.display = 'none';

      try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        if (authStep === 'passcode') {
          const passVal = document.getElementById('input-passcode').value.trim();
          if (passVal === '2411712') {
            authStep = 'login';
            document.getElementById('auth-title').innerText = "تسجيل الدخول";
            document.getElementById('wrap-passcode').style.display = 'none';
            document.getElementById('wrap-username').style.display = 'flex';
            document.getElementById('wrap-password').style.display = 'flex';
            console.log("انتقال لخطوة تسجيل الدخول");
          } else {
            errorBox.innerText = "رمز خطأ!";
            errorBox.style.display = 'block';
          }
        } else if (authStep === 'login') {
          const userVal = document.getElementById('input-username').value.trim();
          const passVal = document.getElementById('input-password').value.trim();
          
          console.log("جاري التحقق من:", userVal);
          
          const { data, error } = await client
            .from('account_requests')
            .select('*')
            .eq('username', userVal)
            .eq('password', passVal)
            .maybeSingle();

          if (error) throw error;
          if (data) {
             alert("نجاح! سيتم الدخول...");
             // هنا كود الانتقال للشاشة الرئيسية
          } else {
             errorBox.innerText = "بيانات خاطئة!";
             errorBox.style.display = 'block';
          }
        }
      } catch (err) {
        console.error("خطأ:", err);
        errorBox.innerText = "خطأ: " + err.message;
        errorBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
