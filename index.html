<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Private Chat App</title>

  <!-- App-like display (hide browser UI when launched as an app / installed) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Private Chat">
  <meta name="theme-color" content="#0b090a">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUHJpdmF0ZSBDaGF0Iiwic2hvcnRfbmFtZSI6IkNoYXQiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6ImZ1bGxzY3JlZW4iLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBiMDkwYSIsInRoZW1lX2NvbG9yIjoiIzBiMDkwYSIsIm9yaWVudGF0aW9uIjoicG9ydHJhaXQifQ==">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=El+Messiri:wght@400;600;700&family=Reem+Kufi:wght@400;700&family=Changa:wght@400;600;700&family=Lalezar&family=Rakkas&family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root[data-theme="crimson"] {
      --bg-main:#0b090a;
      --bg-radial:radial-gradient(circle at top right,#1a080c,#0b090a 60%);
      --card-bg:#161a1d;
      --accent-color:#e63946;
      --accent-gradient:linear-gradient(135deg,#d90429 0%,#ef233c 50%,#800020 100%);
      --glass-border:rgba(255,255,255,.08);
      --text-main:#f8fafc;
      --text-muted:#b1a7a6;
      --glow-effect:0 0 20px rgba(230,57,70,.35);
      --msg-me-shadow:0 4px 15px rgba(217,4,41,.35);
    }

    :root[data-theme="doom"] {
      --bg-main:#030503;
      --bg-radial:radial-gradient(ellipse at 50% 20%,#0a1a0d 0%,#050a05 35%,#020402 65%,#000000 100%);
      --card-bg:#0a120a;
      --accent-color:#00ff41;
      --accent-gradient:linear-gradient(135deg,#00ff41 0%,#00cc33 25%,#006622 60%,#1a1a1a 100%);
      --glass-border:rgba(0,255,65,.1);
      --text-main:#e0f2e0;
      --text-muted:#558b2f;
      --glow-effect:0 0 30px rgba(0,255,65,.4), 0 0 60px rgba(0,255,65,.08);
      --msg-me-shadow:0 4px 20px rgba(0,255,65,.3), 0 0 40px rgba(0,255,65,.05);
    }
    :root[data-theme="doom"] .chat-item:hover {
      border-color:#00ff41;
      background:rgba(0,255,65,.04);
      box-shadow:0 0 15px rgba(0,255,65,.1);
    }
    :root[data-theme="doom"] .msg-group.me .bubble {
      background:linear-gradient(135deg, rgba(0,40,10,.85) 0%, rgba(10,15,10,.9) 100%);
      border-color:rgba(0,255,65,.15);
      box-shadow:0 3px 15px rgba(0,255,65,.12), inset 0 1px 0 rgba(0,255,65,.05);
    }
    :root[data-theme="doom"] .msg-group.other .bubble {
      background:rgba(255,255,255,.04);
      border-color:rgba(0,255,65,.08);
    }
    :root[data-theme="doom"] .input-container {
      background-color:rgba(3,8,3,.95);
      border-top-color:rgba(0,255,65,.12);
    }
    :root[data-theme="doom"] .input-wrapper {
      border-color:rgba(0,255,65,.1);
    }
    :root[data-theme="doom"] .input-wrapper:focus-within {
      border-color:rgba(0,255,65,.3);
      box-shadow:0 0 15px rgba(0,255,65,.1);
    }
    :root[data-theme="doom"] .header {
      background-color:rgba(3,8,3,.85);
      border-bottom-color:rgba(0,255,65,.1);
    }
    :root[data-theme="doom"] .settings-drawer {
      background:rgba(5,10,5,.98);
    }
    :root[data-theme="doom"] .poll-vote-btn:hover {
      border-color:#00ff41;
      background:rgba(0,255,65,.06);
    }
    :root[data-theme="doom"] .poll-fill-bar {
      background:linear-gradient(90deg, #00ff41, #004d00);
      opacity:.18;
    }

    :root[data-theme="neon"] {
      --bg-main:#030712;
      --bg-radial:radial-gradient(circle at top right,#002b53 0%,#030712 65%);
      --card-bg:#0b1528;
      --accent-color:#00f0ff;
      --accent-gradient:linear-gradient(135deg,#00f0ff 0%,#0072ff 50%,#002b80 100%);
      --glass-border:rgba(0,240,255,.15);
      --text-main:#f0f9ff;
      --text-muted:#94a3b8;
      --glow-effect:0 0 25px rgba(0,240,255,.4);
      --msg-me-shadow:0 4px 15px rgba(0,114,255,.4);
    }

    :root[data-theme="mono"] {
      --bg-main:#080808;
      --bg-radial:radial-gradient(circle at top right,#252525 0%,#0d0d0d 45%,#050505 100%);
      --card-bg:#171717;
      --accent-color:#f5f5f5;
      --accent-gradient:linear-gradient(135deg,#ffffff 0%,#bdbdbd 48%,#555555 100%);
      --glass-border:rgba(255,255,255,.13);
      --text-main:#fafafa;
      --text-muted:#a3a3a3;
      --glow-effect:0 0 22px rgba(255,255,255,.18);
      --msg-me-shadow:0 4px 15px rgba(255,255,255,.12);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:var(--user-font,'Cairo'),-apple-system,sans-serif;
    }

    html,body {
      width:100%;
      height:100%;
      min-height:100vh;
      overflow:hidden;
      background:var(--bg-main);
      color:var(--text-main);
    }

    button,input { font:inherit; }

    .screen {
      display:none;
      width:100vw;
      height:100dvh;
      min-height:100vh;
      flex-direction:column;
      background:var(--bg-radial);
      position:relative;
    }

    .screen.active { display:flex; }

    .back-btn-absolute {
      position:absolute;
      top:20px;
      left:20px;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      color:var(--text-main);
      width:40px;
      height:40px;
      border-radius:50%;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:20;
    }

    .back-btn-absolute:hover {
      border-color:var(--accent-color);
      color:var(--accent-color);
    }

    .auth-container {
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
    }

    .auth-container i {
      font-size:3.8rem;
      color:var(--accent-color);
      margin-bottom:20px;
      filter:drop-shadow(var(--glow-effect));
    }

    .auth-container h2 {
      margin-bottom:10px;
      font-size:1.6rem;
    }

    .auth-container p {
      color:var(--text-muted);
      margin-bottom:20px;
      font-size:.95rem;
    }

    .auth-input-wrapper {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:20px;
      padding:10px 20px;
      display:flex;
      width:100%;
      max-width:380px;
      margin-bottom:12px;
    }

    .auth-input-wrapper input {
      flex:1;
      background:transparent;
      border:none;
      color:#fff;
      outline:none;
      font-size:.95rem;
      text-align:center;
      min-width:0;
    }

    .primary-btn {
      background:var(--accent-gradient);
      color:#fff;
      border:none;
      padding:12px 30px;
      border-radius:20px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:var(--msg-me-shadow);
      width:100%;
      max-width:380px;
      margin-top:5px;
      -webkit-tap-highlight-color:transparent;
    }

    .primary-btn:active { transform:scale(.98); }

    .secondary-link {
      color:var(--text-muted);
      margin-top:15px;
      cursor:pointer;
      font-size:.85rem;
      text-decoration:underline;
    }

    .error-msg {
      color:#ff4d4d;
      background:rgba(255,77,77,.1);
      border:1px solid rgba(255,77,77,.3);
      padding:10px;
      border-radius:12px;
      font-size:.85rem;
      width:100%;
      max-width:380px;
      margin-bottom:15px;
      display:none;
      text-align:center;
      word-break:break-word;
    }

    .header {
      padding:12px 16px;
      padding-top:max(12px,env(safe-area-inset-top));
      border-bottom:1px solid var(--glass-border);
      background-color:rgba(3,7,18,.78);
      backdrop-filter:blur(14px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
      flex:0 0 auto;
    }

    .header h3 { font-size:1.1rem; }

    .chat-header-main {
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
    }

    .chat-back {
      flex:0 0 auto;
      font-size:1.15rem;
      cursor:pointer;
      padding:6px;
    }

    .chat-avatar {
      width:42px;
      height:42px;
      flex:0 0 42px;
      border-radius:50%;
      background:var(--accent-gradient);
      border:2px solid var(--accent-color);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:1.05rem;
      font-weight:800;
      box-shadow:var(--glow-effect);
      overflow:hidden;
    }

    .chat-user-info {
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      line-height:1.15;
    }

    .chat-user-name {
      font-size:1rem;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:48vw;
    }

    .chat-user-status {
      color:var(--text-muted);
      font-size:.72rem;
      margin-top:4px;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:5px;
    }

    .status-dot {
      width:7px;
      height:7px;
      border-radius:50%;
      display:inline-block;
      flex:0 0 7px;
      background:#8b8f98;
    }

    .chat-user-status.online { color:#22c55e; }

    .chat-user-status.online .status-dot {
      background:#22c55e;
      box-shadow:0 0 7px rgba(34,197,94,.65);
    }

    .chat-user-status.offline .status-dot { background:#8b8f98; }

    .chat-header-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .chat-header-icon {
      width:34px;
      height:34px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:var(--text-muted);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:1rem;
    }

    .chat-header-icon:hover {
      color:var(--accent-color);
      background:rgba(255,255,255,.06);
    }

    .chat-theme-small {
      width:30px;
      height:30px;
      font-size:.78rem;
      border:1px solid var(--glass-border);
      background:var(--card-bg);
      color:var(--accent-color);
    }

    .search-bar {
      padding:15px 20px;
      display:flex;
      gap:10px;
      border-bottom:1px solid var(--glass-border);
      flex:0 0 auto;
    }

    .search-bar input {
      flex:1;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:15px;
      padding:10px 15px;
      color:#fff;
      outline:none;
      font-size:.9rem;
      min-width:0;
    }

    .search-bar button {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      color:var(--accent-color);
      padding:10px 15px;
      border-radius:15px;
      cursor:pointer;
      font-weight:bold;
      font-size:.9rem;
      white-space:nowrap;
    }

    .chat-list {
      flex:1;
      overflow-y:auto;
      padding:10px;
    }

    .empty-state {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100%;
      color:var(--text-muted);
      opacity:.7;
      text-align:center;
    }

    .empty-state i {
      font-size:3rem;
      margin-bottom:15px;
    }

    .chat-item {
      display:flex;
      align-items:center;
      gap:15px;
      padding:15px;
      background:var(--card-bg);
      border-radius:15px;
      margin-bottom:10px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .chat-item:hover {
      border-color:var(--accent-color);
      background:rgba(22,26,29,.9);
    }

    .chat-item .avatar {
      width:45px;
      height:45px;
      border-radius:50%;
      background:var(--accent-gradient);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:1.2rem;
      color:#fff;
      flex:0 0 45px;
      overflow:hidden;
    }

    .avatar-img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .chat-box {
      flex:1;
      min-height:0;
      padding:20px 20px calc(var(--composer-height, 105px) + var(--keyboard-offset, 0px) + 20px);
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      overscroll-behavior:contain;
    }

    .msg-group {
      display:flex;
      flex-direction:column;
      margin-bottom:12px;
      width:fit-content;
      max-width:75%;
      position:relative;
      min-width:0;
    }
    .msg-group:has(.poll-card) { max-width:82%; }

    .msg-group.me { align-self:flex-end; }
    .msg-group.other { align-self:flex-start; }

    .bubble {
      padding:10px 16px;
      border-radius:22px;
      font-size:.95rem;
      line-height:1.55;
      word-break:break-word;
      overflow-wrap:anywhere;
      white-space:pre-wrap;
      direction:rtl;
      text-align:right;
      unicode-bidi:plaintext;
      max-width:100%;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      cursor:default;
    }

    /* Messages do not open any menu on tap */
    .message-actions,
    .emoji-picker {
      display:none !important;
    }

    .message-actions {
      display:none;
      position:absolute;
      bottom:calc(100% + 6px);
      right:0;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:6px;
      gap:4px;
      z-index:50;
      box-shadow:var(--glow-effect);
      white-space:nowrap;
    }

    .msg-group.show-actions .message-actions { display:flex; }

    .message-actions button {
      border:none;
      background:transparent;
      cursor:pointer;
      font-size:1.2rem;
      padding:5px;
      border-radius:10px;
      color:var(--text-main);
    }

    .message-actions button:hover { background:rgba(255,255,255,.08); }

    .reaction-more {
      font-size:1.1rem !important;
      color:var(--text-main);
    }

    .emoji-picker {
      display:none;
      position:absolute;
      bottom:calc(100% + 6px);
      right:0;
      width:min(310px,88vw);
      max-height:220px;
      overflow-y:auto;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:10px;
      grid-template-columns:repeat(8,1fr);
      gap:5px;
      z-index:60;
      box-shadow:var(--glow-effect);
    }

    .emoji-picker.show { display:grid; }

    .emoji-picker button {
      border:0;
      background:transparent;
      font-size:1.35rem;
      padding:5px;
      cursor:pointer;
      border-radius:9px;
    }

    .emoji-picker button:hover { background:rgba(255,255,255,.08); }

    .reaction-badge {
      display:flex;
      gap:3px;
      margin-top:4px;
      flex-wrap:wrap;
    }

    .reaction-badge span {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:12px;
      padding:2px 6px;
      font-size:.75rem;
    }

    .msg-group.me .bubble {
      /* Sent message: neutral color instead of red */
      background:rgba(55,55,58,.92);
      color:#fff;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 3px 12px rgba(0,0,0,.16);
    }

    :root[data-theme="neon"] .msg-group.me .bubble {
      background:rgba(18,35,52,.94);
      border-color:rgba(255,255,255,.10);
    }

    :root[data-theme="mono"] .msg-group.me .bubble {
      background:rgba(58,58,58,.94);
      border-color:rgba(255,255,255,.14);
    }

    .msg-group.other .bubble {
      background:rgba(255,255,255,.07);
      color:var(--text-main);
      border:1px solid var(--glass-border);
    }

    .msg-time {
      font-size:.65rem;
      opacity:.75;
      margin-top:4px;
      display:block;
      text-align:left;
    }

    .input-container {
      position:fixed;
      left:0;
      right:0;
      bottom:calc(var(--keyboard-offset,0px) + 3px);
      padding:12px 16px;
      padding-bottom:max(14px,env(safe-area-inset-bottom));
      background-color:rgba(3,7,18,.92);
      border-top:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      gap:12px;
      backdrop-filter:blur(10px);
      z-index:100;
      transition:bottom .12s ease;
      transform:translateZ(0);
    }

    .input-wrapper {
      flex:1;
      background-color:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:24px;
      padding:7px 10px;
      display:grid;
      grid-template-columns:34px minmax(0,1fr) 34px;
      align-items:end;
      gap:7px;
      min-width:0;
      direction:ltr;
      overflow:hidden;
      transition:height .12s ease;
    }

    .input-wrapper textarea {
      width:100%;
      min-width:0;
      min-height:34px;
      max-height:132px;
      resize:none;
      overflow-y:auto;
      align-self:center;
      background:transparent;
      border:none;
      color:#fff;
      font-size:.95rem;
      line-height:1.45;
      outline:none;
      padding:6px 2px;
      direction:rtl;
      text-align:right;
      -webkit-user-select:text;
      user-select:text;
      -webkit-tap-highlight-color:transparent;
      font-family:var(--user-font,'Cairo'), -apple-system, sans-serif;
    }

    .input-wrapper textarea::placeholder {
      color:var(--text-muted);
      opacity:.85;
    }

    .input-icons {
      display:none;
    }

    .attach-btn {
      grid-column:1;
      grid-row:1;
      width:34px;
      height:34px;
      border:0;
      background:transparent;
      color:var(--text-muted);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.15rem;
      cursor:pointer;
      padding:0;
      transition:color .2s, background .2s, transform .15s;
    }

    .attach-btn:hover {
      color:var(--accent-color);
      background:rgba(255,255,255,.07);
    }

    .attach-btn:active {
      transform:scale(.94);
    }

    /* ATTACHMENT MENU */
    .attachment-menu {
      position:fixed;
      right:16px;
      bottom:calc(var(--keyboard-offset,0px) + var(--composer-height,105px) + 10px);
      width:min(250px,calc(100vw - 32px));
      padding:8px;
      background:rgba(18,18,18,.98);
      border:1px solid var(--glass-border);
      border-radius:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.45),var(--glow-effect);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:none;
      flex-direction:column;
      gap:5px;
      z-index:220;
      animation:themePickerIn .16s ease-out;
    }
    .attachment-menu.show { display:flex; }
    .attachment-option {
      width:100%;
      border:1px solid transparent;
      background:rgba(255,255,255,.045);
      color:var(--text-main);
      border-radius:13px;
      padding:11px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      cursor:pointer;
      text-align:right;
      transition:background .15s,transform .15s,border-color .15s;
    }
    .attachment-option:hover {
      background:rgba(255,255,255,.09);
      border-color:var(--glass-border);
      transform:translateY(-1px);
    }
    .attachment-option i {
      width:30px;
      text-align:center;
      color:var(--accent-color);
      font-size:1.05rem;
    }
    .attachment-option span { flex:1; font-weight:700; font-size:.86rem; }

    /* POLL MODAL */
    .poll-modal { z-index:300; }
    .poll-question {
      width:100%;
      min-height:105px;
      resize:vertical;
      background:var(--bg-main);
      border:1px solid var(--accent-color);
      color:var(--text-main);
      border-radius:14px;
      padding:12px;
      outline:none;

    .poll-options-list {

    .poll-option-editor { display:flex; gap:7px; align-items:center; }
    .poll-option-editor input {
      flex:1;
      min-width:0;
      background:var(--bg-main);
      border:1px solid var(--glass-border);

    .poll-multiple {

    .poll-card {

      width:100%;min-width:auto;
      direction:rtl;
    }
    .poll-card-title {
      font-weight:700;font-size:.78rem;white-space:normal;
      line-height:1.3;text-align:right;overflow-wrap:anywhere;
      margin-bottom:2px;
    }
    .poll-vote-btn {
      position:relative;overflow:hidden;width:100%;text-align:right;

    .poll-vote-btn.selected { border-color:var(--accent-color);background:rgba(255,255,255,.08); }
    .poll-fill-bar {
      position:absolute;top:0;right:0;height:100%;background:var(--accent-color);

    .poll-option-content {

    }
    .poll-indicator {
      width:12px;height:12px;display:flex;align-items:center;justify-content:center;

    }
    .poll-vote-btn.selected .poll-indicator { color:var(--accent-color); }
    .poll-vote-label { flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-size:.72rem; }
    .poll-percent {
      margin-inline-start:auto;font-size:.62rem;color:var(--text-muted);
      font-weight:700;min-width:22px;text-align:left;
    }
    .poll-results { color:var(--text-muted);font-size:.6rem;text-align:right;margin-top:2px; }
    /* CRITICAL: override white-space:pre-wrap inside bubble for polls */
    .bubble .poll-card, .bubble .poll-card * { white-space:normal; }

    /* Media attachments (no bubble wrapper) */

    .media-content a { display:block;line-height:0; }
    .media-content img.attachment-preview-image {
      max-width:100%;max-height:260px;height:auto;border-radius:18px;display:block;
    }
    .media-content video.attachment-preview-video {
      max-width:100%;max-height:260px;border-radius:18px;display:block;
    }
    .attachment-card { display:flex;flex-direction:column;gap:8px; }
    .attachment-card a { color:inherit;text-decoration:none; }
    .attachment-preview-image { max-width:100%;max-height:280px;border-radius:14px;display:block;object-fit:contain; }
    .attachment-preview-video { max-width:100%;max-height:300px;border-radius:14px;display:block; }
    .attachment-file { display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.06); }
    .attachment-file i { color:var(--accent-color);font-size:1.3rem; }
    .location-card { display:flex;align-items:center;gap:10px; }

    .send-btn {

      grid-row:1;
      width:34px;
      height:34px;
      color:var(--accent-color);

      padding:4px;
      align-items:center;
      justify-content:center;

    .theme-btn {
      background:transparent;
      border:none;
      color:var(--accent-color);
      font-size:1.2rem;
      cursor:pointer;
      position:relative;
      padding:5px;
    }

    .theme-picker {
      position:fixed;
      top:68px;
      right:16px;
      width:190px;
      padding:10px;
      background:rgba(18,18,18,.97);
      border:1px solid var(--glass-border);
      border-radius:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.45), var(--glow-effect);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:none;
      flex-direction:column;
      gap:7px;
      z-index:250;
      animation:themePickerIn .16s ease-out;
    }

    .theme-picker.show { display:flex; }

    .theme-picker-title {
      color:#fff;
      font-size:.82rem;
      font-weight:800;
      padding:4px 8px 7px;
      border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom:2px;
    }

    .theme-option {
      width:100%;
      border:1px solid transparent;
      background:rgba(255,255,255,.045);
      color:#f5f5f5;
      border-radius:13px;
      padding:9px 10px;
      display:flex;
      align-items:center;
      gap:9px;
      cursor:pointer;
      text-align:right;
      transition:transform .15s, background .15s, border-color .15s;
    }

    .theme-option:hover {
      background:rgba(255,255,255,.09);
      transform:translateY(-1px);
    }

    .theme-option.active {
      border-color:rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);
    }

    .theme-dot {
      width:23px;
      height:23px;
      flex:0 0 23px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.25);
      box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);
    }

    .theme-dot.crimson { background:linear-gradient(135deg,#ef233c,#800020); }
    .theme-dot.neon { background:linear-gradient(135deg,#00f0ff,#0072ff); }
    .theme-dot.mono { background:linear-gradient(135deg,#fff,#bdbdbd 50%,#333); }
    .theme-dot.doom { background:linear-gradient(135deg,#00ff41 0%,#006622 40%,#1a1a1a 70%,#c0c0c0 100%); }

    .theme-option-name { flex:1; font-size:.82rem; font-weight:700; }
    .theme-option-check { opacity:0; font-size:.8rem; }
    .theme-option.active .theme-option-check { opacity:1; }

    @keyframes themePickerIn {
      from { opacity:0; transform:translateY(-6px) scale(.98); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }

    @media (max-width:420px) {
      .theme-picker { right:10px; width:180px; }

    window.addEventListener('beforeunload', () => {

          client.from('account_requests').update({ session_id: null }).eq('id', currentAccountData.id).then(() => {});

      }

    /* =========================
       APP-LIKE BEHAVIOR
       (fullscreen bounce prevention + privacy shield)
    ========================== */

    html, body {
      overscroll-behavior-y: none;
    }

    /* =========================
       DOOM SPLASH SCREEN v2
    ========================== */

    .doom-splash {
      position:fixed;
      inset:0;
      z-index:500;
      background:#020402;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      transition:opacity 1.8s cubic-bezier(.4,0,.2,1), filter 1.5s ease;
    }
    .doom-splash.hidden {
      opacity:0;
      filter:brightness(2) saturate(0);
      pointer-events:none;
    }

    .doom-splash-bg {
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 50% 50%, #0a1a0a 0%, #020402 60%, #000000 100%);
    }
    .doom-splash-img {
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center center;
      filter:contrast(1.05);
      position:relative;
      z-index:2;
    }

    /* Dark vignette overlay */
    .doom-splash-vignette {
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(0,0,0,.5) 60%, rgba(0,0,0,.92) 100%);
      pointer-events:none;
      z-index:3;
    }

    /* Film grain texture */
    .doom-splash-grain {
      position:absolute;
      inset:0;
      opacity:.035;
      pointer-events:none;
      z-index:4;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Invisible tap zone over Doom's right hand area */
    .doom-tap-zone {
      position:absolute;
      top:15%;
      right:5%;
      width:45%;
      height:45%;
      z-index:20;
      cursor:pointer;
      background:transparent;
      border:none;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    /* =========================
       MAGIC EFFECTS
    ========================== */

    .doom-magic-stage {
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:15;
      display:none;
      overflow:hidden;
    }
    .doom-magic-stage.active { display:block; }

    /* Rotating magic circles with runes */
    .doom-runic-ring {
      position:absolute;
      top:30%;
      right:25%;
      width:200px;
      height:200px;
      transform:translate(50%,-50%);
      border-radius:50%;
      border:1px solid rgba(0,255,65,.15);
      animation:doom-ring-spin 8s linear infinite;
    }
    .doom-runic-ring::before {
      content:'';
      position:absolute;
      inset:-20px;
      border-radius:50%;
      border:1px dashed rgba(0,255,65,.1);
      animation:doom-ring-spin-reverse 12s linear infinite;
    }
    .doom-runic-ring::after {
      content:'';
      position:absolute;
      inset:-40px;
      border-radius:50%;
      border:1px dotted rgba(0,255,65,.08);
      animation:doom-ring-spin 20s linear infinite;
    }
    @keyframes doom-ring-spin { to { transform:translate(50%,-50%) rotate(360deg); } }
    @keyframes doom-ring-spin-reverse { to { transform:translate(50%,-50%) rotate(-360deg); } }

    /* Rune symbols on the rings */
    .doom-rune-sym {
      position:absolute;
      color:rgba(0,255,65,.5);
      font-size:.7rem;
      font-family:'Courier New',monospace;
      font-weight:bold;
      text-shadow:0 0 8px rgba(0,255,65,.6);
      animation:doom-rune-glow 2s ease-in-out infinite;
    }
    @keyframes doom-rune-glow {
      0%,100% { opacity:.3; text-shadow:0 0 4px rgba(0,255,65,.3); }
      50% { opacity:.9; text-shadow:0 0 12px rgba(0,255,65,.8), 0 0 20px rgba(0,255,65,.4); }
    }

    /* Expanding shockwave rings (green + black mix) */
    .doom-shockwave {
      position:absolute;
      top:30%;
      right:25%;
      width:200px;
      height:200px;
      transform:translate(50%,-50%);
      border-radius:50%;
      opacity:0;
    }
    .doom-shockwave.green {
      border:2px solid rgba(0,255,65,.5);
      box-shadow:0 0 30px rgba(0,255,65,.3), inset 0 0 30px rgba(0,255,65,.1);
      animation:doom-shock-expand 1.5s ease-out forwards;
    }
    .doom-shockwave.dark {
      border:3px solid rgba(0,20,0,.7);
      box-shadow:0 0 40px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.4);
      animation:doom-shock-expand 1.8s ease-out .2s forwards;
    }
    .doom-shockwave.mixed {
      border:1px solid rgba(0,255,65,.25);
      background:radial-gradient(circle, rgba(0,255,65,.08) 0%, rgba(0,0,0,.3) 50%, transparent 70%);
      animation:doom-shock-expand 2s ease-out .4s forwards;
    }
    @keyframes doom-shock-expand {
      0% { transform:translate(50%,-50%) scale(0); opacity:.9; }
      40% { opacity:.5; }
      100% { transform:translate(50%,-50%) scale(8); opacity:0; }
    }

    /* Green lightning arcs */
    .doom-lightning {
      position:absolute;
      top:30%;
      right:25%;
      width:4px;
      height:4px;
      transform:translate(50%,-50%);
      z-index:16;
    }
    .doom-lightning-bolt {
      position:absolute;
      background:linear-gradient(180deg, #00ff41, #004d1a);
      width:2px;
      border-radius:1px;
      opacity:0;
      box-shadow:0 0 8px #00ff41, 0 0 16px rgba(0,255,65,.5);
      animation:doom-bolt-flash .15s ease-out forwards;
    }
    @keyframes doom-bolt-flash {
      0% { opacity:1; transform:scaleY(0); }
      50% { opacity:1; }
      100% { opacity:0; transform:scaleY(1); }
    }

    /* Dark mist / smoke tendrils */
    .doom-mist {
      position:absolute;
      border-radius:50%;
      background:radial-gradient(circle, rgba(0,255,65,.06) 0%, rgba(0,10,0,.4) 40%, transparent 70%);
      filter:blur(20px);
      animation:doom-mist-flow 3s ease-out forwards;
    }
    @keyframes doom-mist-flow {
      0% { transform:scale(0) translate(0,0); opacity:.8; }
      50% { opacity:.4; }
      100% { transform:scale(4) translate(var(--mx), var(--my)); opacity:0; }
    }

    /* Particle explosion — green AND black particles */
    .doom-particle-green {
      position:absolute;
      width:3px;
      height:3px;
      background:#00ff41;
      border-radius:50%;
      box-shadow:0 0 6px #00ff41, 0 0 12px rgba(0,255,65,.4);
      animation:doom-part-fly .9s ease-out forwards;
    }
    .doom-particle-black {
      position:absolute;
      width:4px;
      height:4px;
      background:#0a0a0a;
      border-radius:50%;
      box-shadow:0 0 4px rgba(0,0,0,.8), inset 0 0 2px rgba(0,255,65,.2);
      animation:doom-part-fly 1.1s ease-out forwards;
    }
    .doom-particle-ember {
      position:absolute;
      width:2px;
      height:2px;
      background:#33ff66;
      border-radius:50%;
      box-shadow:0 0 4px #33ff66;
      animation:doom-part-fly .7s ease-out forwards;
    }
    @keyframes doom-part-fly {
      0% { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(var(--tx), var(--ty)) scale(0); opacity:0; }
    }

    /* Floating hexagrams */
    .doom-hexagram {
      position:absolute;
      width:40px;
      height:40px;
      opacity:0;
      animation:doom-hex-appear 1.5s ease-out forwards;
    }
    .doom-hexagram svg {
      width:100%;
      height:100%;
      filter:drop-shadow(0 0 6px rgba(0,255,65,.5));
    }
    @keyframes doom-hex-appear {
      0% { opacity:0; transform:scale(0) rotate(0deg); }
      30% { opacity:.7; }
      100% { opacity:0; transform:scale(1.5) rotate(180deg); }
    }

    /* Screen flash — green fading to black */
    .doom-flash {
      position:fixed;
      inset:0;
      background:radial-gradient(circle at 70% 30%, rgba(0,255,65,.2) 0%, rgba(0,20,0,.6) 50%, #000 100%);
      opacity:0;
      pointer-events:none;
      z-index:14;
      animation:doom-flash-anim .6s ease-out forwards;
    }
    @keyframes doom-flash-anim {
      0% { opacity:.6; }
      50% { opacity:.3; }
      100% { opacity:0; }
    }

    /* Chromatic aberration glitch on activation */
    .doom-glitch {
      position:absolute;
      inset:0;
      z-index:13;
      pointer-events:none;
      opacity:0;
      animation:doom-glitch-anim .3s ease-out forwards;
    }
    .doom-glitch::before {
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,255,65,.03);
      transform:translateX(-3px);
    }
    .doom-glitch::after {
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.05);
      transform:translateX(3px);
    }
    @keyframes doom-glitch-anim {
      0% { opacity:1; }
      100% { opacity:0; }
    }

    /* Energy beam lines radiating outward */
    .doom-beam {
      position:absolute;
      top:30%;
      right:25%;
      width:2px;
      height:200px;
      background:linear-gradient(180deg, rgba(0,255,65,.6), transparent);
      transform-origin:top center;
      transform:translate(50%,-50%) rotate(var(--angle)) scaleY(0);
      filter:blur(1px);
      animation:doom-beam-fire .5s ease-out forwards;
    }
    @keyframes doom-beam-fire {
      0% { transform:translate(50%,-50%) rotate(var(--angle)) scaleY(0); opacity:1; }
      50% { opacity:.8; }
      100% { transform:translate(50%,-50%) rotate(var(--angle)) scaleY(1.5); opacity:0; }
    }

    /* Matrix-like code rain briefly */
    .doom-code-rain {
      position:absolute;
      color:rgba(0,255,65,.15);
      font-family:'Courier New',monospace;
      font-size:.6rem;
      font-weight:bold;
      writing-mode:vertical-rl;
      text-orientation:upright;
      animation:doom-code-fall 1s linear forwards;
      pointer-events:none;
      z-index:12;
    }
    @keyframes doom-code-fall {
      0% { transform:translateY(-20px); opacity:0; }
      20% { opacity:.6; }
      100% { transform:translateY(60px); opacity:0; }
    }

    #privacy-shield {

      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:.7rem;
    }

    .profile-name-input {
      width:100%;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:15px;
      padding:10px 15px;
      color:#fff;
      outline:none;
      font-size:.9rem;
      text-align:right;
      direction:rtl;
    }

    .profile-save-btn {
      width:100%;
      background:var(--accent-gradient);
      color:#fff;
      border:none;
      padding:10px 20px;
      border-radius:15px;
      font-size:.88rem;
      font-weight:700;
      cursor:pointer;
    }

    .profile-save-btn:active { transform:scale(.98); }
    .profile-save-btn:disabled { opacity:.6; cursor:default; }

    .profile-save-status {
      font-size:.75rem;
      color:var(--text-muted);
      min-height:1em;
      text-align:center;
    }

    .font-option {
      display:flex;
      flex-direction:column;
      gap:6px;
      width:100%;
      border:1px solid var(--glass-border);
      background:rgba(255,255,255,.04);
      color:var(--text-main);
      border-radius:16px;
      padding:11px 14px;
      margin-bottom:9px;
      cursor:pointer;
      text-align:right;
      transition:transform .15s, background .15s, border-color .15s;
    }

    .font-option:hover {
      background:rgba(255,255,255,.08);
      transform:translateY(-1px);
    }

    .font-option.active {
      border-color:rgba(255,255,255,.3);
      background:rgba(255,255,255,.1);
    }

    .font-option-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .font-option-name {
      font-size:.75rem;
      font-weight:700;
      color:var(--text-muted);
    }

    .font-option-check {
      opacity:0;
      font-size:.78rem;
      color:#fff;
    }

    .font-option.active .font-option-check { opacity:1; }

    .lang-option {
      display:flex;align-items:center;justify-content:space-between;
      width:100%;border:1px solid var(--glass-border);
      background:rgba(255,255,255,.04);color:var(--text-main);
      border-radius:16px;padding:11px 14px;margin-bottom:9px;
      cursor:pointer;text-align:right;
      transition:transform .15s, background .15s, border-color .15s;
    }
    .lang-option:hover {
      background:rgba(255,255,255,.08);
      transform:translateY(-1px);
    }
    .lang-option.active {
      border-color:rgba(255,255,255,.3);
      background:rgba(255,255,255,.1);
    }
    .lang-option-check {
      opacity:0;font-size:.78rem;color:#fff;
    }
    .lang-option.active .lang-option-check { opacity:1; }

    .font-option-sample {
      font-size:1.05rem;
      line-height:1.5;
      direction:rtl;
      text-align:right;
    }

    .settings-btn {
      position:relative;
    }

    .modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.8);
      z-index:100;
      align-items:center;
      justify-content:center;
      backdrop-filter:blur(5px);
    }

    .modal-content {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      width:90%;
      max-width:400px;
      border-radius:20px;
      padding:20px;
      display:flex;
      flex-direction:column;
      max-height:80vh;
      box-shadow:var(--glow-effect);
    }

    .modal-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
      border-bottom:1px solid var(--glass-border);
      padding-bottom:10px;
    }

    .modal-close {
      cursor:pointer;
      font-size:1.2rem;
      color:var(--text-muted);
    }

    .requests-list {
      overflow-y:auto;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
  </style>
</head>

<!-- AUTH -->
  <div id="auth-screen" class="screen">
    <div class="back-btn-absolute" id="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </div>

    <div class="auth-container">
      <i class="fa-solid fa-lock" id="auth-icon"></i>

      <h2 id="auth-title" data-i18n="auth.title.passcode">Security Code</h2>
      <p id="auth-desc" data-i18n="auth.desc.passcode">Enter security code to access</p>

      <div class="error-msg" id="error-box"></div>

      <div class="auth-input-wrapper" id="wrap-passcode">
        <input type="password" id="input-passcode"
               placeholder="Security Code..." data-i18n-placeholder="auth.passcode"
               autocomplete="off">
      </div>

      <div class="auth-input-wrapper" id="wrap-username" style="display:none;">
        <input type="text" id="input-username"
               placeholder="Username" data-i18n-placeholder="auth.username"
               autocomplete="username">
      </div>

      <div class="auth-input-wrapper" id="wrap-password" style="display:none;">
        <input type="password" id="input-password"
               placeholder="Password..." data-i18n-placeholder="auth.password"
               autocomplete="current-password">
      </div>

      <button type="button" class="primary-btn" id="auth-btn" data-i18n="auth.continue" onclick="handleAuthAction()">Continue</button>

      <span class="secondary-link" id="auth-switch-link" style="display:none;" data-i18n="auth.switch.register">No account? Register</span>

      <span class="secondary-link" id="auth-login-link" style="display:none;" data-i18n="auth.switch.login">Have an account? Login</span>
    </div>
  </div>

  <!-- HOME -->
  <div id="home-screen" class="screen">
    <div class="header">
      <h3 id="welcome-text">Private Chats</h3>

      <div style="display:flex;gap:15px;align-items:center;">
        <button type="button" class="theme-btn" id="requests-btn" title="Chat Requests" data-i18n-title="home.requests">
          <i class="fa-solid fa-bell"></i>
          <span id="req-badge"
                style="display:none;background:#ef4444;color:white;border-radius:50%;padding:1px 5px;font-size:9px;position:absolute;top:-5px;right:-8px;">0</span>
        </button>

        <button type="button" class="theme-btn theme-toggle-btn" title="Change Theme" data-i18n-title="chat.theme">
          <i class="fa-solid fa-sun theme-icon"></i>
        </button>

        <button type="button" class="theme-btn settings-btn" id="open-settings-btn" title="Settings" data-i18n-title="settings.title">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="search-username"
             placeholder="Search user..." data-i18n-placeholder="home.search"
             autocomplete="off">

      <button type="button" id="start-chat-btn">
        <i class="fa-solid fa-user-plus"></i> <span data-i18n="home.send_request">Send Request</span>
      </button>
    </div>

    <div class="chat-list" id="chat-list">
      <div class="empty-state">
        <i class="fa-regular fa-comments"></i>
        <p>
          No chats yet. Search for a friend and send a request!
        </p>
      </div>
    </div>
  </div>

  <!-- SETTINGS DRAWER -->
  <div class="settings-overlay" id="settings-overlay" aria-hidden="true"></div>

  <div class="settings-drawer" id="settings-drawer" aria-hidden="true">
    <div class="settings-drawer-head">
      <h3 data-i18n="settings.title">Settings</h3>
      <i class="fa-solid fa-xmark settings-drawer-close" id="close-settings-btn"></i>
    </div>

    <div class="settings-drawer-body" id="settings-drawer-body">
      <!-- Profile Section -->
      <div class="settings-section">
        <button type="button" class="settings-section-header open" data-toggle-section="profile-section-body">
          <span data-i18n="settings.profile">Profile</span>
          <i class="fa-solid fa-chevron-down settings-section-arrow"></i>
        </button>

        <div class="settings-section-body show" id="profile-section-body">
          <div class="profile-editor">
            <div class="profile-avatar-wrap" id="profile-avatar-wrap">
              <img id="profile-avatar-img" class="avatar-img" style="display:none;" alt="Profile picture">
              <i class="fa-solid fa-user profile-avatar-placeholder" id="profile-avatar-placeholder"></i>
              <div class="profile-avatar-edit"><i class="fa-solid fa-camera"></i></div>
            </div>

            <input type="file" id="profile-avatar-input" accept="image/*" style="display:none;">

            <input type="text" id="profile-name-input" class="profile-name-input"
                   placeholder="Your display name in chat" data-i18n-placeholder="settings.name_placeholder" maxlength="30" autocomplete="off">

            <button type="button" id="profile-save-btn" class="profile-save-btn" data-i18n="settings.save">Save</button>
            <div class="profile-save-status" id="profile-save-status"></div>
          </div>
        </div>
      </div>

      <!-- Font Section -->
      <div class="settings-section">
        <button type="button" class="settings-section-header" data-toggle-section="fonts-section-body">
          <span data-i18n="settings.font">Font</span>
          <i class="fa-solid fa-chevron-down settings-section-arrow"></i>
        </button>

        <div class="settings-section-body" id="fonts-section-body">
          <div id="font-options-list"></div>
        </div>
      </div>

    function t(key) {
      try {
        const lang = localStorage.getItem('private-chat-lang') || 'en';
        return TRANSLATIONS[lang]?.[key] || TRANSLATIONS['en'][key] || key;
      } catch (e) {
        return key;
      }
    }

    function setLanguage(lang) {
      const allowed = ['en', 'ar'];
      if (!allowed.includes(lang)) lang = 'en';
      localStorage.setItem('private-chat-lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      updateAuthUI();
      if (currentUser) {
        document.getElementById('welcome-text').innerText = t('home.welcome') + currentUser;
      }
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (!key) return;
        el.textContent = t(key);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (key) el.placeholder = t(key);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.dataset.i18nTitle;
        if (key) el.title = t(key);
      });
      document.querySelectorAll('.lang-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.lang === lang);
      });
    }

    function initLanguage() {

    /* =========================
       KEYBOARD / ANDROID
    ========================== */

    function syncKeyboardPosition() {
      const root = document.documentElement;

      if (!window.visualViewport) {
        root.style.setProperty('--keyboard-offset', '0px');
        return;
      }

      const vv = window.visualViewport;

      const keyboardOffset = Math.max(
        0,
        Math.round(window.innerHeight - vv.height - vv.offsetTop)
      );

      root.style.setProperty(
        '--keyboard-offset',
        keyboardOffset + 'px'
      );
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        syncKeyboardPosition();
        if (chatScreen.classList.contains('active')) {
          settleAndScroll();
        }
      });

      window.visualViewport.addEventListener('scroll', () => {
        syncKeyboardPosition();
      });
    }

    window.addEventListener('resize', syncKeyboardPosition);
    syncKeyboardPosition();

    function settleAndScroll() {
      if (!chatScreen.classList.contains('active')) return;
      syncKeyboardPosition();
      updateComposerHeight();
      const scrollToBottom = () => {
        chatBox.scrollTop = chatBox.scrollHeight;
        const lastMsg = chatBox.lastElementChild;
        if (lastMsg) lastMsg.scrollIntoView({ block: 'end', behavior: 'auto' });
      };
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          scrollToBottom();
          setTimeout(scrollToBottom, 60);
          setTimeout(scrollToBottom, 150);
          setTimeout(scrollToBottom, 350);
          setTimeout(scrollToBottom, 600);
        });
      });
    }

      if (authStep === 'passcode') {

        authTitle.innerText = t('auth.title.passcode');

      } else if (authStep === 'login') {
        backBtn.style.display = 'flex';

        wrapPasscode.style.display = 'none';
        wrapUser.style.display = 'flex';
        wrapPass.style.display = 'flex';

        switchLink.style.display = 'block';

        authTitle.innerText = t('auth.title.login');

        authBtn.innerText = t('auth.signin');

      } else if (authStep === 'register') {
        backBtn.style.display = 'flex';

        wrapPasscode.style.display = 'none';
        wrapUser.style.display = 'flex';
        wrapPass.style.display = 'flex';

        switchLink.style.display = 'none';

        authIcon.className =

        authTitle.innerText = t('auth.title.register');
        authDesc.innerText = t('auth.desc.register');
        authBtn.innerText = t('auth.submit');

      document.getElementById('input-username').value = '';
      document.getElementById('input-password').value = '';

      updateAuthUI();
    }

    /* =========================
       AUTH ACTION
    ========================== */

    async function handleAuthAction() {
      hideError();

      try {
        /* STEP 1: SECURITY CODE */
        if (authStep === 'passcode') {
          const passVal = document.getElementById('input-passcode').value.trim();
          console.log('Passcode entered:', passVal ? '***' : 'empty');

          if (!passVal) {
            showError(t('auth.error.passcode'));
            return;
          }

          if (passVal === '2411712') {
            console.log('Passcode correct, switching to login');
            switchToLogin();
          } else {
            showError(t('auth.error.invalid_passcode'));
          }

          return;
        }

        /* Supabase is only needed after passcode */
        const client = getSupabase();

        if (!client) {
          showError(t('auth.error.db'));
          return;
        }

        /* STEP 2: LOGIN */
        if (authStep === 'login') {
          const userVal =
            document.getElementById('input-username').value.trim();

          const passVal =
            document.getElementById('input-password').value.trim();

          if (!userVal || !passVal) {
            showError(t('auth.error.fill_fields'));
            return;
          }

          authBtn.disabled = true;
          authBtn.style.opacity = '.7';

          const { data, error } = await client
            .from('account_requests')
            .select('*')
            .eq('username', userVal)
            .eq('password', passVal)
            .maybeSingle();

          authBtn.disabled = false;
          authBtn.style.opacity = '1';

          if (error) {
            console.error(error);

            showError('Error: ' + error.message);

            return;
          }

          if (!data) {
            showError(t('auth.error.invalid_credentials'));
            return;
          }

          if (data.status === 'rejected') {
            showError(t('auth.error.banned'));
            return;
          }

          if (data.status === 'pending') {
            showError(t('auth.error.pending'));
            return;
          }

          if (data.status !== 'approved') {
            showError(t('auth.error.unknown_status'));
            return;
          }

          /* Single-device session check */
          const mySessionId = localStorage.getItem('chat-session-id') || (Math.random().toString(36).slice(2) + Date.now().toString(36));
          localStorage.setItem('chat-session-id', mySessionId);

          try {
            const { data: sess } = await client
              .from('account_requests')
              .select('session_id, session_updated_at')
              .eq('id', data.id)
              .maybeSingle();

            if (sess?.session_id && sess?.session_updated_at) {
              const lastUpdate = new Date(sess.session_updated_at);
              const secondsAgo = (Date.now() - lastUpdate.getTime()) / 1000;
              if (secondsAgo < 30 && sess.session_id !== mySessionId) {
                showError(t('session.in_use'));
                authBtn.disabled = false;
                authBtn.style.opacity = '1';
                return;
              }
            }

            await client
              .from('account_requests')
              .update({ session_id: mySessionId, session_updated_at: new Date().toISOString() })
              .eq('id', data.id);
          } catch (e) {
            /* session columns may not exist yet — continue without restriction */
          }

          currentUser = userVal;
          currentAccountData = data;

          document.getElementById('welcome-text').innerText = t('home.welcome') + currentUser;

          authScreen.classList.remove('active');
          homeScreen.classList.add('active');

          startUsageHeartbeat();
          startOnlinePresence();
          loadRecentChats();
          loadIncomingRequests();
          loadMyProfile();

          setupAccountStatusListener(data.id);
          setupRequestSubscription();
        }

        /* STEP 3: REGISTER */
        else if (authStep === 'register') {
          const userVal =
            document.getElementById('input-username').value.trim();

          const passVal =
            document.getElementById('input-password').value.trim();

          if (!userVal || !passVal) {
            showError(t('auth.error.fill_fields'));
            return;
          }

          authBtn.disabled = true;
          authBtn.style.opacity = '.7';

          const { error } = await client
            .from('account_requests')
            .insert([
              {
                username:userVal,
                password:passVal,
                status:'pending',
                usage_seconds:0
              }
            ]);

          authBtn.disabled = false;
          authBtn.style.opacity = '1';

          if (error) {
            showError(
              error.message ||
              'حدث خطأ أثناء التسجيل / Registration error.'
            );
            return;
          }

          alert(t('auth.success.register'));

          document.getElementById('input-password').value = '';

          switchToLogin();
        }

      } catch (err) {
        console.error('Auth Exception:', err);

        authBtn.disabled = false;
        authBtn.style.opacity = '1';

        showError(t('auth.error.unexpected') + (err && err.message ? err.message : err));
      }
    }

    /* =========================
       ACCOUNT LISTENER
    ========================== */

    function setupAccountStatusListener(accountId) {
      const client = getSupabase();
      if (!client) return;

      if (userStatusSubscription) {
        client.removeChannel(userStatusSubscription);
        userStatusSubscription = null;
      }

      userStatusSubscription =
        client
          .channel(`ban_listener_${accountId}`)
          .on(
            'postgres_changes',
            {
              event:'UPDATE',
              schema:'public',
              table:'account_requests',
              filter:`id=eq.${accountId}`
            },
            payload => {
              if (payload.new.status === 'rejected') {
                alert('your account is banned !');
                window.location.reload();
              }
            }
          )
          .subscribe();
    }

    /* =========================
       REQUEST LISTENER
    ========================== */

    function setupRequestSubscription() {
      const client = getSupabase();
      if (!client || !currentUser) return;

      if (requestSubscription) {
        client.removeChannel(requestSubscription);
        requestSubscription = null;
      }

      requestSubscription =
        client
          .channel(`requests_listener_${currentUser}`)
          .on(
            'postgres_changes',
            {
              event:'INSERT',
              schema:'public',
              table:'chat_requests',
              filter:`receiver=eq.${currentUser}`
            },
            () => {
              loadIncomingRequests();
            }
          )
          .subscribe();
    }

    /* =========================
       USAGE HEARTBEAT
    ========================== */

    function startUsageHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
      }

      heartbeatInterval =
        setInterval(async () => {
          if (
            document.visibilityState !== 'visible' ||
            !currentAccountData
          ) {
            return;
          }

          const client = getSupabase();
          if (!client) return;

          const updatedSecs =
            (currentAccountData.usage_seconds || 0) + 5;

          currentAccountData.usage_seconds =
            updatedSecs;

          await client
            .from('account_requests')
            .update({
              usage_seconds:updatedSecs,
              session_updated_at: new Date().toISOString()
            })
            .eq('id', currentAccountData.id);
        },5000);
    }

    /* =========================
       PRESENCE
    ========================== */

    function updateChatUserStatus() {
      const statusEl =
        document.getElementById('chat-user-status');

      if (!statusEl || !currentChatFriend) return;

      const isOnline =
        onlineUsers.has(currentChatFriend);

      statusEl.classList.toggle(
        'online',
        isOnline
      );

      statusEl.classList.toggle(
        'offline',
        !isOnline
      );

      const textEl =
        statusEl.querySelector('.status-text');

      if (textEl) {
        textEl.innerText = isOnline ? t('chat.online') : t('chat.offline');
      }
    }

    function refreshOnlineUsersFromPresence() {
      if (!presenceChannel) return;

      const state =
        presenceChannel.presenceState();

      onlineUsers =
        new Set(Object.keys(state));

      updateChatUserStatus();
    }

    async function startOnlinePresence() {
      const client = getSupabase();

      if (!client || !currentUser) return;

      if (presenceChannel) {
        try {
          await client.removeChannel(
            presenceChannel
          );
        } catch (e) {}

        presenceChannel = null;
      }

      onlineUsers = new Set();

      presenceChannel =
        client.channel(
          'site-online-users',
          {
            config:{
              presence:{
                key:currentUser
              }
            }
          }
        );

      presenceChannel
        .on(
          'presence',
          {event:'sync'},
          refreshOnlineUsersFromPresence
        )
        .on(
          'presence',
          {event:'join'},
          refreshOnlineUsersFromPresence
        )
        .on(
          'presence',
          {event:'leave'},
          refreshOnlineUsersFromPresence
        )
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({
              user:currentUser,
              online_at:new Date().toISOString()
            });
          }
        });
    }

    /* =========================
       HOME
    ========================== */

    async function loadRecentChats() {
      if (!currentUser) return;

      const client = getSupabase();
      if (!client) return;

      const friends = new Set();

      const { data:reqs } =
        await client
          .from('chat_requests')
          .select('*')
          .eq('status','accepted')
          .or(
            `sender.eq.${currentUser},receiver.eq.${currentUser}`
          );

      if (reqs) {
        reqs.forEach(req => {
          if (req.sender !== currentUser) {
            friends.add(req.sender);
          }

          if (req.receiver !== currentUser) {
            friends.add(req.receiver);
          }
        });
      }

      const { data:msgs } =
        await client
          .from('private_messages')
          .select('*')
          .or(
            `sender.eq.${currentUser},receiver.eq.${currentUser}`
          );

      if (msgs) {
        msgs.forEach(msg => {
          if (msg.sender !== currentUser) {
            friends.add(msg.sender);
          }

          if (msg.receiver !== currentUser) {
            friends.add(msg.receiver);
          }
        });
      }

      chatList.innerHTML = '';

      if (friends.size === 0) {
        chatList.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-comments"></i>
            <p data-i18n="home.no_chats">No chats yet. Search for a friend and send a request!</p>
          </div>
        `;
        return;
      }

      const friendProfiles = await fetchProfilesFor(Array.from(friends));

      friends.forEach(friend => {
        const div =
          document.createElement('div');

        div.className = 'chat-item';

        div.onclick = () =>
          openChat(friend);

        const p = friendProfiles[friend];
        const displayName = (p && p.display_name) ? p.display_name : friend;

        const avatarInner = (p && p.avatar_url)
          ? `<img class="avatar-img" src="${escapeHtml(p.avatar_url)}" alt="">`
          : escapeHtml(friend.charAt(0).toUpperCase());

        div.innerHTML = `
          <div class="avatar">
            ${avatarInner}
          </div>
          <div>
            <h4>${escapeHtml(displayName)}</h4>
          </div>
        `;

        chatList.appendChild(div);
      });
    }

    /* =========================
       REQUESTS
    ========================== */

    async function loadIncomingRequests() {
      const client = getSupabase();

      if (!client || !currentUser) return;

      const { data, error } =
        await client
          .from('chat_requests')
          .select('*')
          .eq('receiver',currentUser)
          .eq('status','pending');

      if (error) {
        console.error(error);
        return;
      }

      const reqBadge =
        document.getElementById('req-badge');

      const reqList =
        document.getElementById('requests-list');

      if (!data || data.length === 0) {
        reqBadge.style.display = 'none';

        reqList.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;">${t('home.no_requests')}</div>`;

        return;
      }

      reqBadge.style.display = 'block';
      reqBadge.innerText = data.length;

      reqList.innerHTML = '';

      data.forEach(req => {
        const item =
          document.createElement('div');

        item.style.cssText =
          'display:flex;justify-content:space-between;align-items:center;background:var(--bg-main);padding:10px 15px;border-radius:12px;border:1px solid var(--glass-border);gap:10px;';

        item.innerHTML = `
          <div>
            <h4 style="font-size:.95rem;color:var(--text-main);">
              ${escapeHtml(req.sender)}
            </h4>

            <span style="font-size:.75rem;color:var(--text-muted);">
              يرغب في مراسلتك
            </span>
          </div>

          <div style="display:flex;gap:8px;">
            <button type="button"
                    class="accept-request"
                    data-id="${req.id}"
                    data-sender="${escapeHtml(req.sender)}"
                    style="background:#22c55e;color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:.8rem;">
              قبول
            </button>

            <button type="button"
                    class="reject-request"
                    data-id="${req.id}"
                    data-sender="${escapeHtml(req.sender)}"
                    style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:.8rem;">
              رفض

    async function respondToRequest(
      reqId,
      newStatus,
      senderName
    ) {
      const client = getSupabase();
      if (!client) return;

      const { error } =
        await client
          .from('chat_requests')
          .update({status:newStatus})
          .eq('id',reqId);

      if (error) {
        alert(
          'حدث خطأ: ' +
          error.message
        );
        return;
      }

      await loadIncomingRequests();
      await loadRecentChats();

      if (newStatus === 'accepted') {
        closeRequestsModal();
        openChat(senderName);
      }
    }

    function openRequestsModal() {
      document.getElementById(
        'requests-modal'
      ).style.display = 'flex';

      loadIncomingRequests();
    }

    function closeRequestsModal() {
      document.getElementById(
        'requests-modal'
      ).style.display = 'none';
    }

    /* =========================
       START CHAT
    ========================== */

    async function startNewChat() {
      const searchInput =
        document.getElementById(
          'search-username'
        );

      const friendName =
        searchInput.value.trim();

      if (!friendName) {
        alert('Please enter a username to search!');
        return;
      }

      if (friendName === currentUser) {
        alert(t('search.self'));
        return;
      }

      const client = getSupabase();
      if (!client) return;

      const {
        data:userCheck,
        error:userError
      } = await client
        .from('account_requests')
        .select('username')
        .eq('username',friendName)
        .eq('status','approved')
        .maybeSingle();

      if (userError || !userCheck) {
        alert(t('search.not_found'));
        return;
      }

      const { data:existingReq } =
        await client
          .from('chat_requests')
          .select('*')
          .or(
            `and(sender.eq.${currentUser},receiver.eq.${friendName}),and(sender.eq.${friendName},receiver.eq.${currentUser})`
          )
          .maybeSingle();

      if (existingReq) {
        if (existingReq.status === 'accepted') {
          searchInput.value = '';
          openChat(friendName);
          return;
        }

        if (existingReq.status === 'pending') {
          alert(t('requests.pending'));
          return;
        }

        if (existingReq.status === 'rejected') {
          await client
            .from('chat_requests')
            .update({
              status:'pending',
              sender:currentUser,
              receiver:friendName
            })
            .eq('id',existingReq.id);

          alert(t('requests.sent'));

          searchInput.value = '';
          return;
        }
      }

      const { error:insertError } =
        await client
          .from('chat_requests')
          .insert([
            {
              sender:currentUser,
              receiver:friendName,
              status:'pending'
            }
          ]);

      if (insertError) {
        alert('Error sending request: ' + insertError.message);
      } else {
        alert(t('requests.sent'));

        searchInput.value = '';
      }
    }

    /* =========================
       CHAT
    ========================== */

    async function openChat(friendName) {
      currentChatFriend = friendName;

      const nameEl =
        document.getElementById(
          'chat-with-name'
        );

      const avatarEl =
        document.getElementById(
          'chat-avatar'
        );

      nameEl.innerText =
        currentChatFriend;

      avatarEl.innerText =
        (
          currentChatFriend ||
          'U'
        ).charAt(0).toUpperCase();

      /* لو الصديق ده حاطط صورة/اسم شات، نستخدمهم بدل الحرف الافتراضي */
      fetchProfilesFor([friendName]).then(profiles => {
        const p = profiles[friendName];
        if (!p || currentChatFriend !== friendName) return;
        if (p.avatar_url) {
          avatarEl.innerHTML = `<img class="avatar-img" src="${escapeHtml(p.avatar_url)}" alt="">`;
        }
        if (p.display_name) {
          nameEl.innerText = p.display_name;
        }
      });

      updateChatUserStatus();

      homeScreen.classList.remove('active');
      chatScreen.classList.add('active');

      chatBox.innerHTML = '';

      msgInput.removeAttribute('readonly');
      msgInput.removeAttribute('disabled');

      try {
        msgInput.focus({
          preventScroll:true
        });
      } catch (e) {
        msgInput.focus();
      }

      const client = getSupabase();
      if (!client) return;

      const { data,error } =
        await client
          .from('private_messages')
          .select('*')
          .or(
            `and(sender.eq.${currentUser},receiver.eq.${currentChatFriend}),and(sender.eq.${currentChatFriend},receiver.eq.${currentUser})`
          )
          .order(
            'created_at',
            {ascending:true}
          );

      if (error) {
        console.error(error);

        chatBox.innerHTML = `<div style="text-align:center;color:#ff4d4d;margin-top:20px;">${t('chat.error.load')}</div>`;
      } else if (data && data.length > 0) {
        data.forEach(addMessageToScreen);
        settleAndScroll();
      } else {
        chatBox.innerHTML = `<div style="text-align:center;color:var(--text-muted);margin-top:20px;">${t('chat.empty')} ${escapeHtml(currentChatFriend)}!</div>`;
      }

      if (messageSubscription) {
        client.removeChannel(
          messageSubscription
        );
      }

      messageSubscription =
        client
          .channel(
            `private_chat_${currentUser}_${currentChatFriend}`
          )
          .on(
            'postgres_changes',
            {
              event:'INSERT',
              schema:'public',
              table:'private_messages'
            },
            payload => {
              const m = payload.new;

              if (
                (m.sender === currentUser &&
                 m.receiver === currentChatFriend) ||
                (m.sender === currentChatFriend &&
                 m.receiver === currentUser)
              ) {
                const placeholder =
                  chatBox.querySelector(
                    '.empty-chat-message'
                  );

                if (placeholder) {
                  placeholder.remove();
                }

                addMessageToScreen(m);
              }
            }
          )
          .subscribe();

      if (pollVoteSubscription) {
        client.removeChannel(pollVoteSubscription);
        pollVoteSubscription = null;
      }
      pollVoteSubscription = client.channel(`poll_votes_${currentUser}_${currentChatFriend}`)
        .on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},payload => {
          const changedId = payload.new?.message_id || payload.old?.message_id;
          if (changedId) {
            loadPollVotes(changedId);
          }
          // Also refresh any other visible polls (belt-and-suspenders)
          chatBox.querySelectorAll('.poll-card[data-poll-id]').forEach(card => {
            const pid = card.dataset.pollId;
            if (pid && pid !== String(changedId)) loadPollVotes(pid);
          });
        }).subscribe();

      settleAndScroll();
    }

    function addMessageToScreen(msg) {
      const isMe = msg.sender === currentUser;
      const group = document.createElement('div');
      const payload = getMessagePayload(msg);
      const isMedia = payload.type === 'attachment' && (payload.kind === 'image' || payload.kind === 'video');

      group.className = `msg-group ${isMe ? 'me' : 'other'}${isMedia ? ' media' : ''}`;
      group.dataset.messageId = msg.id;

      const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

      const bubbleOrMedia = isMedia
        ? `<div class="media-content" data-raw-content="${escapeHtml(msg.content || '')}">${renderMessageContent(msg)}</div>`
        : `<div class="bubble" data-raw-content="${escapeHtml(msg.content || '')}">${renderMessageContent(msg)}</div>`;

      group.innerHTML = `
        <div class="message-actions">
          <button type="button" data-reaction="😂">😂</button>
          <button type="button" data-reaction="🤍">🤍</button>
          <button type="button" data-reaction="🔥">🔥</button>
          <button type="button" data-reaction="👍">👍</button>
          <button type="button" class="reaction-more">+</button>
          ${isMe ? `<button type="button" class="delete-message" title="مسح الرسالة"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>

        <div class="emoji-picker" id="emoji-picker-${msg.id}">
          ${getEmojiList().map(e => `<button type="button" data-extra-reaction="${e}">${e}</button>`).join('')}
        </div>

        ${bubbleOrMedia}

        <span class="msg-time">${timeStr}</span>

        <div class="reaction-badge" id="reactions-${msg.id}"></div>
      `;

      group.querySelectorAll('[data-reaction]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          reactToMessage(msg.id, button.dataset.reaction);
        });
      });

      group.querySelectorAll('[data-extra-reaction]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          reactToMessage(msg.id, button.dataset.extraReaction);
        });
      });

      const moreButton = group.querySelector('.reaction-more');
      if (moreButton) {
        moreButton.addEventListener('click', event => {
          toggleEmojiPicker(event, msg.id);
        });
      }

      /* Poll buttons must be wired after the message HTML is created. */
      group.querySelectorAll('[data-poll-option]').forEach(button => {
        button.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();
          const pollId = button.dataset.pollMessage;
          const optionIndex = Number(button.dataset.pollOption);
          if (!pollId || Number.isNaN(optionIndex)) return;
          voteOnPoll(pollId, optionIndex);
        });
      });

      const deleteButton = group.querySelector('.delete-message');
      if (deleteButton) {
        deleteButton.addEventListener('click', () => {
          deleteMessage(msg.id);
        });
      }

      chatBox.appendChild(group);
      settleAndScroll();

      group.querySelectorAll('img.attachment-preview-image, video.attachment-preview-video').forEach(el => {
        const onReady = () => settleAndScroll();
        if (el.tagName === 'IMG') {
          if (el.complete) onReady();
          else {
            el.addEventListener('load', onReady, { once: true });
            el.addEventListener('error', onReady, { once: true });
          }
        } else if (el.tagName === 'VIDEO') {
          el.addEventListener('loadedmetadata', onReady, { once: true });
          el.addEventListener('error', onReady, { once: true });
        }
      });

      loadReactions(msg.id);
      if (payload.type === 'poll') loadPollVotes(msg.id);
    }

    function getMessagePayload(msg) {
      if (!msg || typeof msg.content !== 'string') return {type:'text', text:''};
      try {
        const parsed = JSON.parse(msg.content);
        if (parsed && typeof parsed === 'object' && parsed.type) return parsed;
      } catch (e) {}
      return {type:'text', text:msg.content};
    }

    function renderMessageContent(msg) {
      const p = getMessagePayload(msg);
      if (p.type === 'poll') return renderPoll(p, msg.id);

      if (p.type === 'attachment') {
        const name = escapeHtml(p.name || 'File');
        const url = escapeHtml(p.url || '#');
        if (p.kind === 'image') {
          return `<a href="${url}" target="_blank" rel="noopener" style="display:block;line-height:0;"><img class="attachment-preview-image" src="${url}" alt="" loading="lazy"></a>`;
        }
        if (p.kind === 'video') {
          return `<video class="attachment-preview-video" controls playsinline src="${url}"></video>`;
        }
        return `<a class="attachment-card" href="${url}" target="_blank" rel="noopener"><div class="attachment-file"><i class="fa-solid fa-file-arrow-down"></i><span>${name}</span></div></a>`;
      }

      if (p.type === 'location') {
        const lat = Number(p.lat);
        const lng = Number(p.lng);
        const maps = `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
        return `<a class="location-card" href="${maps}" target="_blank" rel="noopener"><i class="fa-solid fa-location-dot"></i><span>الموقع المرسل<br><small>فتح في الخريطة</small></span></a>`;
      }

      return escapeHtml(p.text == null ? msg.content : p.text);
    }
