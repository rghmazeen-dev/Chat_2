<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Chat App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }

    .auth-box {
      background: #1e293b;
      padding: 30px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .auth-box h2 { color: #38bdf8; margin-bottom: 20px; font-size: 1.6rem; }
    .input-field {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .toggle-link {
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    #chat-screen {
      display: none;
      width: 100%;
      max-width: 600px;
      height: 85vh;
      background: #1e293b;
      border-radius: 20px;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .chat-header {
      background: #0f172a;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .chat-header h3 { color: #38bdf8; }
    .logout-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 0.95rem; word-break: break-word; }
    .message.my-msg { align-self: flex-start; background: #0284c7; color: #fff; }
    .message.other-msg { align-self: flex-end; background: #334155; color: #f8fafc; }
    .sender-name { font-size: 0.75rem; color: #94a3b8; margin-bottom: 3px; display: block; }

    .chat-input-wrap { padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid #334155; }
    .chat-input-wrap input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    .chat-input-wrap button { padding: 0 20px; background: #38bdf8; border: none; border-radius: 12px; color: #0f172a; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- تسجيل الدخول -->
  <div class="auth-box" id="login-box">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="login-username" class="input-field" placeholder="اسم المستخدم">
    <input type="password" id="login-password" class="input-field" placeholder="كلمة المرور">
    <button class="btn" onclick="loginUser()">دخول</button>
    <div class="toggle-link" onclick="showRegister()">إنشاء حساب جديد</div>
  </div>

  <!-- إنشاء حساب -->
  <div class="auth-box" id="register-box" style="display: none;">
    <h2>حساب جديد</h2>
    <input type="text" id="reg-username" class="input-field" placeholder="اختر اسم مستخدم">
    <input type="password" id="reg-password" class="input-field" placeholder="اختر كلمة مرور">
    <button class="btn" onclick="registerUser()">إنشاء حساب</button>
    <div class="toggle-link" onclick="showLogin()">لديك حساب بالفعل؟ تسجيل الدخول</div>
  </div>

  <!-- الشات -->
  <div id="chat-screen">
    <div class="chat-header">
      <h3 id="welcome-msg">الشات</h3>
      <button class="logout-btn" onclick="logoutUser()">خروج</button>
    </div>
    <div class="chat-messages" id="messages-box"></div>
    <div class="chat-input-wrap">
      <input type="text" id="msg-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2dnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.currentUser = null;
    let heartbeatInterval = null;

    function showRegister() {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('register-box').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('register-box').style.display = 'none';
      document.getElementById('login-box').style.display = 'block';
    }

    // إنشاء حساب جديد
    async function registerUser() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!username || !password) return alert("املاً جميع الخانات!");

      const { data, error } = await supabase
        .from('account_requests')
        .insert([{ username, password, status: 'pending', usage_seconds: 0 }]);

      if (error) {
        alert("حدث خطأ أثناء الطلب: " + error.message);
      } else {
        alert("تم إرسال طلب إنشاء الحساب بنجاح! في انتظار موافقة الأدمن.");
        showLogin();
      }
    }

    // تسجيل الدخول مع فحص الـ Ban والـ Pending
    async function loginUser() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if (!username || !password) return alert("ادخل اسم المستخدم وكلمة المرور!");

      const { data, error } = await supabase
        .from('account_requests')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();

      if (error || !data) return alert("اسم المستخدم أو كلمة المرور غير صحيحة!");

      if (data.status === 'rejected') return alert("your account is banned !");
      if (data.status === 'pending') return alert("حسابك في انتظار موافقة الأدمن!");

      if (data.status === 'approved') {
        window.currentUser = data;
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('welcome-msg').innerText = "أهلاً، " + data.username;

        startUsageHeartbeat();
        loadMessages();
        initRealtimeMessages();
      }
    }

    // العداد الخفي لـ Usage Time
    function startUsageHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(async () => {
        if (document.visibilityState === 'visible' && window.currentUser) {
          const updatedSecs = (window.currentUser.usage_seconds || 0) + 5;
          window.currentUser.usage_seconds = updatedSecs;

          await supabase
            .from('account_requests')
            .update({ usage_seconds: updatedSecs })
            .eq('id', window.currentUser.id);
        }
      }, 5000);
    }

    function logoutUser() {
      window.currentUser = null;
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('chat-screen').style.display = 'none';
    }

    async function loadMessages() {
      const { data } = await supabase.from('messages').select('*').order('id', { ascending: true });
      if (data) {
        const box = document.getElementById('messages-box');
        box.innerHTML = '';
        data.forEach(m => renderMessage(m));
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !window.currentUser) return;
      input.value = '';
      await supabase.from('messages').insert([{ username: window.currentUser.username, message: text }]);
    }

    function renderMessage(msg) {
      const box = document.getElementById('messages-box');
      const div = document.createElement('div');
      const isMe = msg.username === window.currentUser.username;
      div.className = `message ${isMe ? 'my-msg' : 'other-msg'}`;
      div.innerHTML = `<span class="sender-name">${msg.username}</span>${msg.message}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function initRealtimeMessages() {
      supabase.channel('public_chat_messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        renderMessage(payload.new);
      }).subscribe();
    }
  </script>
</body>
</html>
