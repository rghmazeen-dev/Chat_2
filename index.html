    async function loadPollVotes(messageId) {
      const client = getSupabase();
      const group = document.querySelector(`.msg-group[data-message-id="${CSS.escape(String(messageId))}"]`);
      if (!client || !group) return;
      const raw = group.querySelector('.bubble, .media-content')?.dataset?.rawContent || '';
      const payload = getMessagePayload({content:raw});
      const message = await client.from('private_messages').select('content').eq('id',messageId).maybeSingle();
      const p = message.data ? getMessagePayload(message.data) : payload;
      if (!p || p.type !== 'poll') return;
      const {data} = await client.from('message_reactions').select('username,emoji').eq('message_id',messageId).like('emoji','poll:%');
      const counts = {};
      let mine = new Set();
      (data || []).forEach(v => {
        const index = Number(String(v.emoji).replace('poll:',''));
        if (!Number.isNaN(index)) counts[index] = (counts[index] || 0) + 1;
        if (v.username === currentUser && !Number.isNaN(index)) mine.add(index);
      });
      const total = Object.values(counts).reduce((a,b) => a+b,0);
      const isMultiple = !!p.multiple;
      const emptyIcon = isMultiple ? '&#9744;' : '&#9675;';
      const checkedIcon = isMultiple ? '&#9745;' : '&#9679;';
      group.querySelectorAll('[data-poll-option]').forEach(btn => {
        const i = Number(btn.dataset.pollOption);
        const count = counts[i] || 0;
        const pct = total ? Math.round((count / total) * 100) : 0;
        const fill = btn.querySelector(`[data-poll-fill="${i}"]`);
        const percent = btn.querySelector(`[data-poll-percent="${i}"]`);
        const indicator = btn.querySelector(`[data-poll-indicator="${i}"]`);
        if (fill) fill.style.width = total ? (pct + '%') : '0%';
        if (percent) percent.innerText = total ? (pct + '%') : '';
        if (indicator) indicator.innerHTML = mine.has(i) ? checkedIcon : emptyIcon;
        btn.classList.toggle('selected', mine.has(i));
      });
      const results = group.querySelector(`#poll-results-${CSS.escape(String(messageId))}`);
      if (results) results.innerText = total ? `${total} ${total === 1 ? t('poll.vote') : t('poll.votes')}` : t('poll.no_votes');
    }

    async function voteOnPoll(messageId, optionIndex) {
      const client = getSupabase();
      if (!client || !currentUser) return;

      const safeId = CSS.escape(String(messageId));
      const group = document.querySelector(`.msg-group[data-message-id="${safeId}"]`);
      if (!group) return;

      const msgResult = await client
        .from('private_messages')
        .select('content')
        .eq('id', messageId)
        .maybeSingle();

      if (msgResult.error) {
        console.error('Poll message lookup failed:', msgResult.error);
        alert('Failed to load poll.');
        return;
      }

      const p = msgResult.data ? getMessagePayload(msgResult.data) : null;
      if (!p || p.type !== 'poll') return;

      const existing = await client
        .from('message_reactions')
        .select('id,emoji')
        .eq('message_id', messageId)
        .eq('username', currentUser)
        .like('emoji', 'poll:%');

      if (existing.error) {
        console.error('Poll vote lookup failed:', existing.error);
        alert('Failed to load poll votes. Check message_reactions table permissions.');
        return;
      }

      const rows = existing.data || [];
      let result;

      if (p.multiple) {
        const same = rows.find(r => r.emoji === `poll:${optionIndex}`);
        if (same) {
          result = await client.from('message_reactions').delete().eq('id', same.id);
        } else {
          result = await client.from('message_reactions').insert([{
            message_id: messageId,
            username: currentUser,
            emoji: `poll:${optionIndex}`
          }]);
        }
      } else {
        const same = rows.find(r => r.emoji === `poll:${optionIndex}`);
        if (same) {
          result = await client.from('message_reactions').delete().eq('id', same.id);
        } else if (rows.length) {
          result = await client
            .from('message_reactions')
            .update({emoji:`poll:${optionIndex}`})
            .eq('id', rows[0].id);
        } else {
          result = await client.from('message_reactions').insert([{
            message_id: messageId,
            username: currentUser,
            emoji: `poll:${optionIndex}`
          }]);
        }
      }

      if (result?.error) {
        console.error('Poll vote write failed:', result.error);
        alert('Vote not recorded. Check message_reactions table permissions.');
        return;
      }

      await loadPollVotes(messageId);
    }

    async function uploadAndSendFile(file) {
      if (!file || !currentChatFriend) return;
      const client = getSupabase();
      if (!client) return;
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const path = `${currentUser}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`;
      const {error:uploadError} = await client.storage.from(CHAT_FILES_BUCKET).upload(path,file,{upsert:false,contentType:file.type || undefined});
      if (uploadError) {
        alert(t('file.upload_error') + '\n' + uploadError.message);
        return;
      }
      const {data:urlData} = client.storage.from(CHAT_FILES_BUCKET).getPublicUrl(path);
      const url = urlData?.publicUrl;
      if (!url) { alert(t('file.url_error')); return; }
      const kind = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'file';
      await sendStructuredMessage({type:'attachment',kind,url,name:file.name,mime:file.type,size:file.size});
    }

    function updateComposerHeight() {
      const composer = document.querySelector('.input-container');
      if (!composer) return;

      requestAnimationFrame(() => {

        document.documentElement.style.setProperty(

    function insertSoftLineBreaksAt60(value) {
      /*
       * بعد كل 60 حرفًا يتم النزول لسطر جديد.
       * نحافظ على الـ Enter الذي يكتبه المستخدم، ولا نضيف
       * سطرًا جديدًا إذا كان المستخدم بالفعل عند بداية سطر.
       */
      const lines = String(value).split('\n');
      const result = [];

      lines.forEach(line => {
        if (line.length <= 60) {
          result.push(line);
          return;
        }

        for (let i = 0; i < line.length; i += 60) {
          result.push(line.slice(i, i + 60));
        }
      });

      return result.join('\n');
    }

    function handleMessageInput() {
      let value = msgInput.value;

      if (value.length > 9999) {
        value = value.slice(0, 9999);
        msgInput.value = value;

        if (!messageLimitNotified) {
          messageLimitNotified = true;
          alert('This is your limit');
        }
      } else {
        messageLimitNotified = false;
      }

      /* عند الكتابة من نهاية النص: كل 60 حرفًا يبدأ سطرًا جديدًا. */
      if (document.activeElement === msgInput && msgInput.selectionStart === msgInput.value.length) {
        const original = msgInput.value;
        const wrapped = insertSoftLineBreaksAt60(original);

        if (wrapped !== original) {
          const oldLength = original.length;
          msgInput.value = wrapped;
          const added = wrapped.length - oldLength;
          const newPos = Math.min(wrapped.length, msgInput.selectionStart + added);
          try {
            msgInput.setSelectionRange(newPos, newPos);
          } catch (e) {}
        }
      }

      autoResizeMessageInput();
      toggleSendBtn();

      if (chatScreen.classList.contains('active')) {
        requestAnimationFrame(() => settleAndScroll());
      }
    }

      updateComposerHeight();
    }

      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('private-chat-theme', theme); } catch (e) {}

      const themeColors = { crimson:'#0b090a', neon:'#030712', mono:'#080808', doom:'#050a05' };
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', themeColors[theme] || '#0b090a');

      document.querySelectorAll('.theme-icon').forEach(icon => {
        icon.className =
          theme === 'neon'
            ? 'fa-solid fa-moon theme-icon'
            : theme === 'mono'
              ? 'fa-solid fa-circle-half-stroke theme-icon'
              : theme === 'doom'
                ? 'fa-solid fa-mask theme-icon'
                : 'fa-solid fa-sun theme-icon';
      });

      document.querySelectorAll('.theme-option').forEach(option => {
        option.classList.toggle(
          'active',
          option.dataset.themeOption === theme

    const AVATAR_MAX_BYTES = 15.8 * 1024 * 1024; // 15.8MB

    let myProfile = { display_name:'', avatar_url:'' };
    let pendingAvatarFile = null;
    let pendingAvatarPreviewUrl = null;

    function renderProfileAvatar(url) {
      const img = document.getElementById('profile-avatar-img');
      const placeholder = document.getElementById('profile-avatar-placeholder');
      if (!img || !placeholder) return;

      if (url) {
        img.src = url;
        img.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';

      }
    }

      if (nameInput && document.activeElement !== nameInput) {

    }

    async function loadMyProfile() {
      if (!currentUser) return;
      const client = getSupabase();
      if (!client) return;

      try {
        const { data } = await client
          .from(PROFILE_TABLE)
          .select('display_name,avatar_url')
          .eq('username', currentUser)
          .maybeSingle();

        if (data) {
          myProfile.display_name = data.display_name || '';
          myProfile.avatar_url = data.avatar_url || '';
        }
      } catch (e) {
        /* الجدول لسه متعملش أو حصل خطأ في الاتصال - نتجاهل ونسيب البروفايل فاضي */
      }

      renderProfileUI();
    }

    function handleAvatarFileChange(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert(t('settings.avatar_type'));
        event.target.value = '';
        return;
      }

      if (file.size > AVATAR_MAX_BYTES) {
        alert(t('settings.avatar_size'));
        event.target.value = '';
        return;
      }

      pendingAvatarFile = file;

      if (pendingAvatarPreviewUrl) {
        URL.revokeObjectURL(pendingAvatarPreviewUrl);
      }
      pendingAvatarPreviewUrl = URL.createObjectURL(file);
      renderProfileAvatar(pendingAvatarPreviewUrl);
    }

    async function saveProfile() {
      if (!currentUser) return;
      const client = getSupabase();
      if (!client) return;

      const saveBtn = document.getElementById('profile-save-btn');
      const statusEl = document.getElementById('profile-save-status');
      const nameInput = document.getElementById('profile-name-input');
      const displayName = (nameInput ? nameInput.value : '').trim();

      if (saveBtn) saveBtn.disabled = true;
      if (statusEl) statusEl.innerText = t('settings.saving');

      try {
        let avatarUrl = myProfile.avatar_url;

        if (pendingAvatarFile) {
          const safeName = pendingAvatarFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const path = `avatars/${currentUser}/${Date.now()}_${safeName}`;

          const { error:uploadError } = await client.storage
            .from(CHAT_FILES_BUCKET)
            .upload(path, pendingAvatarFile, { upsert:false, contentType:pendingAvatarFile.type || undefined });

          if (uploadError) {
            console.error('Avatar upload error:', uploadError);
            if (statusEl) { statusEl.innerText = t('settings.avatar_error') + (uploadError.message ? (': ' + uploadError.message) : ''); }
            if (saveBtn) saveBtn.disabled = false;
            return;
          }

          const { data:urlData } = client.storage.from(CHAT_FILES_BUCKET).getPublicUrl(path);
          if (urlData && urlData.publicUrl) avatarUrl = urlData.publicUrl;
        }

        const { error:saveError } = await client
          .from(PROFILE_TABLE)
          .upsert(
            [{ username:currentUser, display_name:displayName, avatar_url:avatarUrl, updated_at:new Date().toISOString() }],
            { onConflict:'username' }
          );

        if (saveError) {
          console.error('Profile save error:', saveError);
          if (statusEl) statusEl.innerText = t('settings.save_error');
          if (saveBtn) saveBtn.disabled = false;
          return;
        }

        myProfile.display_name = displayName;
        myProfile.avatar_url = avatarUrl;
        pendingAvatarFile = null;

        if (statusEl) statusEl.innerText = t('settings.saved');
        setTimeout(() => { if (statusEl) statusEl.innerText = ''; }, 2500);
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    async function fetchProfilesFor(usernames) {
      const map = {};
      const list = Array.from(new Set(usernames)).filter(Boolean);
      if (list.length === 0) return map;

      const client = getSupabase();
      if (!client) return map;

      try {
        const { data } = await client
          .from(PROFILE_TABLE)
          .select('username,display_name,avatar_url')
          .in('username', list);

        if (data) {
          data.forEach(row => { map[row.username] = row; });
        }
      } catch (e) {
        /* الجدول لسه متعملش - نرجع خريطة فاضية ونسيب الواجهة تستخدم القيم الافتراضية */
      }

      return map;
    }

    (function initDoomSplash() {
      const splash = document.getElementById('doom-splash');

      const magicStage = document.getElementById('doom-magic-stage');
      const authScreen = document.getElementById('auth-screen');
      const burstOrigin = document.getElementById('doom-burst-origin');
      const lightningContainer = document.getElementById('doom-lightning');
      const runicRing = document.getElementById('doom-runic-ring');

      if (!splash || !tapZone) return;

      let activated = false;
      const runes = ['✦','✧','◈','◇','⟡','⬡','⚹','⯃','✶','✷','◉','◎','✹','✺'];
      const codeChars = '01アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF';

      function addRunesToRing() {
        if (!runicRing) return;
        const count = 16;
        const radius = 90;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count;
          const r = document.createElement('span');
          r.className = 'doom-rune-sym';
          r.textContent = runes[i % runes.length];
          r.style.left = (50 + Math.cos(angle) * 45) + '%';
          r.style.top = (50 + Math.sin(angle) * 45) + '%';
          r.style.transform = 'translate(-50%,-50%)';
          r.style.animationDelay = (i * 0.12) + 's';
          runicRing.appendChild(r);
        }
      }

      function createLightningBolts() {
        if (!lightningContainer) return;
        for (let i = 0; i < 12; i++) {
          const bolt = document.createElement('span');
          bolt.className = 'doom-lightning-bolt';
          const angle = (Math.PI * 2 * i) / 12;
          const len = 60 + Math.random() * 100;
          bolt.style.height = len + 'px';
          bolt.style.left = '0px';
          bolt.style.top = '0px';
          bolt.style.transform = 'rotate(' + (angle * 180 / Math.PI) + 'deg)';
          bolt.style.transformOrigin = 'top center';
          bolt.style.animationDelay = (Math.random() * 0.3) + 's';
          lightningContainer.appendChild(bolt);
        }
      }

      function createParticles() {
        if (!burstOrigin) return;
        const origin = burstOrigin;
        // Green particles
        for (let i = 0; i < 30; i++) {
          const p = document.createElement('span');
          p.className = 'doom-particle-green';
          const angle = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.3;
          const dist = 60 + Math.random() * 140;
          p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          p.style.animationDelay = (Math.random() * 0.2) + 's';
          origin.appendChild(p);
        }
        // Black particles (dark energy)
        for (let i = 0; i < 20; i++) {
          const p = document.createElement('span');
          p.className = 'doom-particle-black';
          const angle = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5) * 0.5;
          const dist = 40 + Math.random() * 100;
          p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          p.style.animationDelay = (0.1 + Math.random() * 0.3) + 's';
          origin.appendChild(p);
        }
        // Ember particles
        for (let i = 0; i < 15; i++) {
          const p = document.createElement('span');
          p.className = 'doom-particle-ember';
          const angle = Math.random() * Math.PI * 2;
          const dist = 80 + Math.random() * 120;
          p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          p.style.animationDelay = (Math.random() * 0.25) + 's';
          origin.appendChild(p);
        }
      }

      function createMist() {
        for (let i = 0; i < 8; i++) {
          const m = document.createElement('div');
          m.className = 'doom-mist';
          const size = 80 + Math.random() * 120;
          m.style.width = size + 'px';
          m.style.height = size + 'px';
          m.style.left = (20 + Math.random() * 60) + '%';
          m.style.top = (20 + Math.random() * 60) + '%';

          m.style.setProperty('--my', my + 'px');
          m.style.animationDelay = (Math.random() * 0.4) + 's';

      function createBeams() {
        for (let i = 0; i < 16; i++) {

      function activate() {
        if (activated) return;

              if (passInput) passInput.focus();

      }

      tapZone.addEventListener('click', activate);
      tapZone.addEventListener('touchstart', (e) => { e.preventDefault(); activate(); }, { passive: false });
    })();

    /* =========================
       APP-LIKE BEHAVIOR
       (fullscreen on tap + best-effort privacy shield
       when the app is backgrounded / switched away from)
    ========================== */

    function requestAppFullscreen() {
      const el = document.documentElement;
      const req =
        el.requestFullscreen ||
        el.webkitRequestFullscreen ||
        el.mozRequestFullScreen ||
        el.msRequestFullscreen;
      if (!req) return;
      try {
        const result = req.call(el);
        if (result && result.catch) result.catch(() => {});
      } catch (e) {}
    }

    document.addEventListener('click', () => {
      const inFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;
      if (!inFullscreen) requestAppFullscreen();
    });

    function showPrivacyShield() {
      const shield = document.getElementById('privacy-shield');
      if (shield) shield.classList.add('show');
    }

    function hidePrivacyShield() {
      const shield = document.getElementById('privacy-shield');
      if (shield) shield.classList.remove('show');
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) showPrivacyShield();
      else hidePrivacyShield();
    });

    window.addEventListener('blur', showPrivacyShield);
    window.addEventListener('focus', hidePrivacyShield);
    window.addEventListener('pageshow', hidePrivacyShield);
  </script>

  <!-- PRIVACY SHIELD: best-effort cover shown while the app is
       backgrounded/switched away from. NOTE: this can reduce what
       shows in the recent-apps preview on some devices, but it is
       NOT a guarantee — a native Android app is the only way to
       fully block the system app-switcher screenshot (FLAG_SECURE). -->
  <div id="privacy-shield" aria-hidden="true">
    <i class="fa-solid fa-lock"></i>
  </div>
</body>
</html>
