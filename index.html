:root[data-theme="crimson"] {

* { box-sizing:border-box; margin:0; padding:0; font-family: var(--font-primary); }
html,body { width:100%; height:100%; min-height:100vh; overflow:hidden; background:var(--bg-main); color:var(--text-main); overscroll-behavior-y: none; }
button,input,textarea { font:inherit; }

.screen { display:none; width:100vw; height:100dvh; min-height:100vh; flex-direction:column; background:var(--bg-radial); position:relative; }
.screen.active { display:flex; }

.back-btn-absolute { position:absolute; top:20px; left:20px; background:var(--card-bg); border:1px solid var(--glass-border); color:var(--text-main); width:40px; height:40px; border-radius:50%; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:20; }
.back-btn-absolute:hover { border-color:var(--accent-color); color:var(--accent-color); }

.auth-container { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
.auth-container i { font-size:3.8rem; color:var(--accent-color); margin-bottom:20px; filter:drop-shadow(var(--glow-effect)); }
.auth-container h2 { margin-bottom:10px; font-size:1.6rem; }
.auth-container p { color:var(--text-muted); margin-bottom:20px; font-size:.95rem; }
.auth-input-wrapper { background:var(--card-bg); border:1px solid var(--glass-border); border-radius:20px; padding:10px 20px; display:flex; width:100%; max-width:380px; margin-bottom:12px; }
.auth-input-wrapper input { flex:1; background:transparent; border:none; color:#fff; outline:none; font-size:.95rem; text-align:center; min-width:0; }
.primary-btn { background:var(--accent-gradient); color:#fff; border:none; padding:12px 30px; border-radius:20px; font-size:1rem; font-weight:700; cursor:pointer; box-shadow:var(--msg-me-shadow); width:100%; max-width:380px; margin-top:5px; -webkit-tap-highlight-color:transparent; }
.primary-btn:active { transform:scale(.98); }
.secondary-link { color:var(--text-muted); margin-top:15px; cursor:pointer; font-size:.85rem; text-decoration:underline; }
.error-msg { color:#ff4d4d; background:rgba(255,77,77,.1); border:1px solid rgba(255,77,77,.3); padding:10px; border-radius:12px; font-size:.85rem; width:100%; max-width:380px; margin-bottom:15px; display:none; text-align:center; word-break:break-word; }

.header { padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top)); border-bottom:1px solid var(--glass-border); background-color:var(--header-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:flex; justify-content:space-between; align-items:center; z-index:10; flex:0 0 auto; }
.header h3 { font-size:1.1rem; }
.chat-header-main { display:flex; align-items:center; gap:11px; min-width:0; }
.chat-back { flex:0 0 auto; font-size:1.15rem; cursor:pointer; padding:6px; color:var(--text-main); }
.chat-avatar { width:42px; height:42px; flex:0 0 42px; border-radius:50%; background:var(--accent-gradient); border:2px solid var(--accent-color); display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.05rem; font-weight:800; box-shadow:var(--glow-effect); overflow:hidden; }
.chat-user-info { min-width:0; display:flex; flex-direction:column; align-items:flex-start; line-height:1.15; }
.chat-user-name { font-size:1rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:48vw; }
.chat-user-status { color:var(--text-muted); font-size:.72rem; margin-top:4px; white-space:nowrap; display:flex; align-items:center; gap:5px; }
.status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 7px; background:#8b8f98; }
.chat-user-status.online { color:var(--status-online); }
.chat-user-status.online .status-dot { background:var(--status-online); box-shadow:0 0 7px rgba(0,168,132,.65); }
.chat-user-status.offline .status-dot { background:#8b8f98; }
.chat-header-actions { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.chat-header-icon { width:34px; height:34px; border:0; border-radius:50%; background:transparent; color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1rem; }
.chat-header-icon:hover { color:var(--accent-color); background:rgba(255,255,255,.06); }
.chat-theme-small { width:30px; height:30px; font-size:.78rem; border:1px solid var(--glass-border); background:var(--card-bg); color:var(--accent-color); }

.search-bar { padding:15px 20px; display:flex; gap:10px; border-bottom:1px solid var(--glass-border); flex:0 0 auto; }
.search-bar input { flex:1; background:var(--card-bg); border:1px solid var(--glass-border); border-radius:15px; padding:10px 15px; color:#fff; outline:none; font-size:.9rem; min-width:0; }
.search-bar button { background:var(--card-bg); border:1px solid var(--glass-border); color:var(--accent-color); padding:10px 15px; border-radius:15px; cursor:pointer; font-weight:bold; font-size:.9rem; white-space:nowrap; }
.chat-list { flex:1; overflow-y:auto; padding:10px; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-muted); opacity:.7; text-align:center; }
.empty-state i { font-size:3rem; margin-bottom:15px; }
.chat-item { display:flex; align-items:center; gap:15px; padding:15px; background:var(--card-bg); border-radius:15px; margin-bottom:10px; cursor:pointer; border:1px solid transparent; transition: all .15s ease; }
.chat-item:hover { border-color:var(--accent-color); background:rgba(255,255,255,.03); }
.chat-item .avatar { width:45px; height:45px; border-radius:50%; background:var(--accent-gradient); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.2rem; color:#fff; flex:0 0 45px; overflow:hidden; }
.avatar-img { width:100%; height:100%; object-fit:cover; display:block; }

.settings-overlay { position:fixed; inset:0; background:rgba(0,0,0,.58); opacity:0; visibility:hidden; pointer-events:none; transition:opacity .2s ease, visibility .2s ease; z-index:500; }
.settings-overlay.show { opacity:1; visibility:visible; pointer-events:auto; }
.settings-drawer { position:fixed; top:0; right:0; width:min(390px, 92vw); height:100dvh; max-height:100vh; background:var(--bg-main); color:var(--text-main); border-left:1px solid var(--glass-border); box-shadow:-18px 0 45px rgba(0,0,0,.35), var(--glow-effect); z-index:510; display:flex; flex-direction:column; overflow:hidden; transform:translateX(105%); visibility:hidden; pointer-events:none; transition:transform .24s ease, visibility .24s ease; box-sizing:border-box; }
.settings-drawer.show { transform:translateX(0); visibility:visible; pointer-events:auto; }
.settings-drawer-head { flex:0 0 auto; min-height:64px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--glass-border); background:rgba(0,0,0,.12); box-sizing:border-box; }
.settings-drawer-head h3 { margin:0; font-size:1.05rem; font-weight:900; }
.settings-drawer-close { width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--text-muted); cursor:pointer; font-size:1.15rem; transition:background .15s, color .15s, transform .15s; }
.settings-drawer-close:hover { color:var(--text-main); background:rgba(255,255,255,.08); }
.settings-drawer-close:active { transform:scale(.94); }
.settings-drawer-body { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:12px; box-sizing:border-box; overscroll-behavior:contain; }
.settings-section { margin-bottom:9px; border:1px solid var(--glass-border); border-radius:15px; overflow:hidden; background:rgba(255,255,255,.035); }
.settings-section-header { width:100%; min-height:50px; border:0; background:transparent; color:var(--text-main); display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; text-align:right; cursor:pointer; font-weight:800; }
.settings-section-header:hover { background:rgba(255,255,255,.055); }
.settings-section-arrow { transition:transform .2s ease; color:var(--text-muted); }
.settings-section-header.open .settings-section-arrow { transform:rotate(180deg); }
.settings-section-body { display:none; padding:0 12px 12px; }
.settings-section-body.show { display:block; }
.profile-editor { display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:4px; }
.profile-avatar-wrap { width:92px; height:92px; flex:0 0 92px; position:relative; border-radius:50%; overflow:hidden; background:rgba(255,255,255,.07); border:2px solid var(--accent-color); display:flex; align-items:center; justify-content:center; box-sizing:border-box; cursor:pointer; }
.profile-avatar-wrap .avatar-img { width:100%; height:100%; object-fit:cover; }
.profile-avatar-placeholder { color:var(--text-muted); font-size:2rem; }
.profile-avatar-edit { position:absolute; right:3px; bottom:3px; width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--accent-color); color:#fff; border:2px solid var(--bg-main); font-size:.72rem; pointer-events:none; }
.profile-name-input { width:100%; box-sizing:border-box; min-height:46px; padding:10px 13px; border-radius:12px; border:1px solid var(--glass-border); outline:none; background:var(--bg-main); color:var(--text-main); font:inherit; }
.profile-name-input:focus { border-color:var(--accent-color); }
.profile-save-btn { width:100%; min-height:44px; border:0; border-radius:12px; background:var(--accent-gradient); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
.profile-save-status { min-height:18px; width:100%; text-align:center; color:var(--text-muted); font-size:.78rem; }
.lang-option { width:100%; border:1px solid var(--glass-border); background:rgba(255,255,255,.035); color:var(--text-main); border-radius:11px; padding:10px 12px; margin-top:7px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font:inherit; font-weight:700; }
.lang-option-check { opacity:.35; }
.lang-option.active .lang-option-check { opacity:1; color:var(--accent-color); }
@media (max-width:420px) { .settings-drawer { width:100vw; border-left:0; } }

.chat-box { flex:1; min-height:0; padding:16px 14px calc(var(--composer-height, 70px) + env(safe-area-inset-bottom) + 8px); overflow-y:auto; display:flex; flex-direction:column; overscroll-behavior:contain; background: var(--chat-bg); gap: 4px; }
.msg-group { display:flex; flex-direction:column; margin-bottom:4px; width:fit-content; max-width:78%; position:relative; min-width:0; align-self: flex-start; }
.msg-group.me { align-self:flex-end; }
.msg-group:has(.poll-card) { max-width:85%; }
.bubble { padding:8px 12px; border-radius:var(--bubble-other-radius); font-size:.92rem; line-height:1.5; word-break:break-word; overflow-wrap:anywhere; white-space:pre-wrap; direction:rtl; text-align:right; unicode-bidi:plaintext; max-width:100%; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:default; background:var(--msg-other-bg); color:var(--text-main); border:1px solid transparent; position:relative; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
:root[data-theme="whatsapp"] .msg-group.other .bubble::before { content:''; position:absolute; left:-8px; top:0; width:0; height:0; border-style:solid; border-width:0 10px 10px 0; border-color:transparent var(--msg-other-bg) transparent transparent; }
.msg-group.me .bubble { background:var(--msg-me-bg); color:#fff; border-radius:var(--bubble-me-radius); box-shadow:var(--msg-me-shadow); border:1px solid transparent; }
:root[data-theme="whatsapp"] .msg-group.me .bubble::before { content:''; position:absolute; right:-8px; top:0; width:0; height:0; border-style:solid; border-width:10px 10px 0 0; border-color:var(--msg-me-bg) transparent transparent transparent; }
:root[data-theme="instagram"] .msg-group.me .bubble { border: 1px solid rgba(255,255,255,.06); }
:root[data-theme="instagram"] .msg-group.other .bubble { border: 1px solid rgba(255,255,255,.06); }
.message-actions, .emoji-picker { display:none !important; }
.msg-time { font-size:.65rem; opacity:.7; margin-top:3px; display:block; text-align:left; color: var(--text-muted); }
.msg-group.me .msg-time { text-align:right; color: rgba(255,255,255,.7); }
.read-receipts { display: inline-flex; align-items: center; gap: 1px; margin-inline-start: 4px; font-size: .7rem; color: var(--checkmark-color); }
.read-receipts i { font-size: .65rem; }

.input-container { position:fixed; left:0; right:0; bottom:0; padding:8px 12px; padding-bottom:max(8px, env(safe-area-inset-bottom)); background-color:var(--composer-bg); border-top:1px solid var(--glass-border); display:flex; align-items:flex-end; gap:8px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:100; transition: transform .12s ease; transform:translateZ(0); min-height: 56px; }
.input-wrapper { flex:1; background-color:var(--input-bg); border:1px solid var(--glass-border); border-radius:24px; padding:6px 8px; display:grid; grid-template-columns:36px minmax(0,1fr) 36px; align-items:end; gap:6px; min-width:0; direction:ltr; overflow:hidden; transition:height .12s ease; max-height: 140px; }
.input-wrapper textarea { width:100%; min-width:0; min-height:32px; max-height:120px; resize:none; overflow-y:auto; align-self:center; background:transparent; border:none; color:var(--text-main); font-size:.95rem; line-height:1.45; outline:none; padding:5px 2px; direction:rtl; text-align:right; -webkit-user-select:text; user-select:text; -webkit-tap-highlight-color:transparent; font-family: var(--font-primary); }
.input-wrapper textarea::placeholder { color:var(--text-muted); opacity:.85; }
.attach-btn { grid-column:1; grid-row:1; width:36px; height:36px; border:0; background:transparent; color:var(--text-muted); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; padding:0; transition:color .2s, background .2s, transform .15s; align-self: end; margin-bottom: 2px; }
.attach-btn:hover { color:var(--accent-color); background:rgba(255,255,255,.07); }
.attach-btn:active { transform:scale(.94); }
.send-btn { grid-column:3; grid-row:1; width:36px; height:36px; color:var(--accent-color); font-size:1.3rem; cursor:pointer; display:none; padding:4px; align-items:center; justify-content:center; border-radius:50%; -webkit-tap-highlight-color:transparent; align-self: end; margin-bottom: 2px; background: transparent; border: none; }
.send-btn:active { transform:scale(.92); }

.attachment-menu { position:fixed; right:12px; bottom:calc(var(--composer-height, 70px) + env(safe-area-inset-bottom) + 8px); width:min(260px, calc(100vw - 24px)); padding:8px; background:var(--card-bg); border:1px solid var(--glass-border); border-radius:18px; box-shadow:0 14px 40px rgba(0,0,0,.45), var(--glow-effect); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); display:none; flex-direction:column; gap:5px; z-index:220; animation: pickerIn .16s ease-out; }
.attachment-menu.show { display:flex; }

function t(key) { try { const lang = localStorage.getItem('private-chat-lang') || 'en'; return TRANSLATIONS[lang]?.[key] || TRANSLATIONS['en'][key] || key; } catch (e) { return key; } }
function setLanguage(lang) { const allowed = ['en','ar']; if (!allowed.includes(lang)) lang = 'en'; localStorage.setItem('private-chat-lang', lang); document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; updateAuthUI(); if (currentUser) document.getElementById('welcome-text').innerText = t('home.welcome') + currentUser; document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (k) el.textContent = t(k); }); document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.dataset.i18nPlaceholder; if (k) el.placeholder = t(k); }); document.querySelectorAll('[data-i18n-title]').forEach(el => { const k = el.dataset.i18nTitle; if (k) el.title = t(k); }); document.querySelectorAll('.lang-option').forEach(opt => opt.classList.toggle('active', opt.dataset.lang === lang)); }
function initLanguage() { let saved = 'en'; try { saved = localStorage.getItem('private-chat-lang') || 'en'; } catch(e){} setLanguage(saved); }

const authScreen = document.getElementById('auth-screen'), homeScreen = document.getElementById('home-screen'), chatScreen = document.getElementById('chat-screen');
const chatBox = document.getElementById('chat-box'), chatList = document.getElementById('chat-list'), msgInput = document.getElementById('message-input'), errorBox = document.getElementById('error-box');
const backBtn = document.getElementById('back-btn'), authBtn = document.getElementById('auth-btn');

function syncKeyboardPosition() {
  const root = document.documentElement;
  if (!window.visualViewport) { root.style.setProperty('--keyboard-offset', '0px'); return; }
  const vv = window.visualViewport;
  const ko = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  root.style.setProperty('--keyboard-offset', ko + 'px');
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => { syncKeyboardPosition(); if (chatScreen.classList.contains('active')) settleAndScroll(); });
  window.visualViewport.addEventListener('scroll', syncKeyboardPosition);
}
window.addEventListener('resize', syncKeyboardPosition);
syncKeyboardPosition();

function settleAndScroll() {
  if (!chatScreen.classList.contains('active')) return;
  syncKeyboardPosition(); updateComposerHeight();
  requestAnimationFrame(() => { requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; const lm = chatBox.lastElementChild; if (lm) lm.scrollIntoView({block:'end',behavior:'auto'}); }); });
}

function showError(m) { errorBox.innerText = m || 'Error'; errorBox.style.display = 'block'; }
function hideError() { errorBox.innerText = ''; errorBox.style.display = 'none'; }

function updateAuthUI() {
  hideError();
  const wp = document.getElementById('wrap-passcode'), wu = document.getElementById('wrap-username'), wpass = document.getElementById('wrap-password');
  const sl = document.getElementById('auth-switch-link'), ll = document.getElementById('auth-login-link');
  const at = document.getElementById('auth-title'), ad = document.getElementById('auth-desc'), ai = document.getElementById('auth-icon');
  if (authStep === 'passcode') {
    backBtn.style.display = 'none'; wp.style.display = 'flex'; wu.style.display = 'none'; wpass.style.display = 'none';
    sl.style.display = 'none'; ll.style.display = 'none'; ai.className = 'fa-solid fa-lock';
    at.innerText = t('auth.title.passcode'); ad.innerText = t('auth.desc.passcode'); authBtn.innerText = t('auth.continue');
  } else if (authStep === 'login') {
    backBtn.style.display = 'flex'; wp.style.display = 'none'; wu.style.display = 'flex'; wpass.style.display = 'flex';
    sl.style.display = 'block'; ll.style.display = 'none'; ai.className = 'fa-solid fa-right-to-bracket';
    at.innerText = t('auth.title.login'); ad.innerText = t('auth.desc.login'); authBtn.innerText = t('auth.signin');
  } else {
    backBtn.style.display = 'flex'; wp.style.display = 'none'; wu.style.display = 'flex'; wpass.style.display = 'flex';
    sl.style.display = 'none'; ll.style.display = 'block'; ai.className = 'fa-solid fa-user-plus';
    at.innerText = t('auth.title.register'); ad.innerText = t('auth.desc.register'); authBtn.innerText = t('auth.submit');
  }
}
function switchToRegister() { authStep = 'register'; updateAuthUI(); document.getElementById('input-username').focus(); }
function switchToLogin() { authStep = 'login'; updateAuthUI(); try { document.getElementById('input-username').focus(); } catch(e){} }
function goBackToPasscode() { authStep = 'passcode'; document.getElementById('input-passcode').value = ''; document.getElementById('input-username').value = ''; document.getElementById('input-password').value = ''; updateAuthUI(); }

async function handleAuthAction() {
  hideError();
  try {
    if (authStep === 'passcode') {
      const pv = document.getElementById('input-passcode').value.trim();
      if (!pv) { showError(t('auth.error.passcode')); return; }
      if (pv === '2411712') switchToLogin(); else showError(t('auth.error.invalid_passcode'));
      return;
    }
    const client = getSupabase(); if (!client) { showError(t('auth.error.db')); return; }
    if (authStep === 'login') {
      const uv = document.getElementById('input-username').value.trim(), pv = document.getElementById('input-password').value.trim();
      if (!uv || !pv) { showError(t('auth.error.fill_fields')); return; }
      authBtn.disabled = true; authBtn.style.opacity = '.7';
      const { data, error } = await client.from('account_requests').select('*').eq('username', uv).eq('password', pv).maybeSingle();
      authBtn.disabled = false; authBtn.style.opacity = '1';
      if (error) { showError('Error: ' + error.message); return; }
      if (!data) { showError(t('auth.error.invalid_credentials')); return; }
      if (data.status === 'rejected') { showError(t('auth.error.banned')); return; }
      if (data.status === 'pending') { showError(t('auth.error.pending')); return; }
      if (data.status !== 'approved') { showError(t('auth.error.unknown_status')); return; }
      const sid = localStorage.getItem('chat-session-id') || (Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem('chat-session-id', sid);
      try {
        const { data: sess } = await client.from('account_requests').select('session_id,session_updated_at').eq('id', data.id).maybeSingle();
        if (sess?.session_id && sess?.session_updated_at) {
          const lu = new Date(sess.session_updated_at), sa = (Date.now() - lu.getTime()) / 1000;
          if (sa < 30 && sess.session_id !== sid) { showError(t('session.in_use')); authBtn.disabled = false; authBtn.style.opacity = '1'; return; }
        }
        await client.from('account_requests').update({ session_id: sid, session_updated_at: new Date().toISOString() }).eq('id', data.id);
      } catch(e){}
      currentUser = uv; currentAccountData = data;
      document.getElementById('welcome-text').innerText = t('home.welcome') + currentUser;
      authScreen.classList.remove('active'); homeScreen.classList.add('active');
      startUsageHeartbeat(); startOnlinePresence(); loadRecentChats(); loadIncomingRequests(); loadMyProfile();
      setupAccountStatusListener(data.id); setupRequestSubscription();
    } else if (authStep === 'register') {
      const uv = document.getElementById('input-username').value.trim(), pv = document.getElementById('input-password').value.trim();
      if (!uv || !pv) { showError(t('auth.error.fill_fields')); return; }
      authBtn.disabled = true; authBtn.style.opacity = '.7';
      const { error } = await client.from('account_requests').insert([{ username: uv, password: pv, status: 'pending', usage_seconds: 0 }]);
      authBtn.disabled = false; authBtn.style.opacity = '1';
      if (error) { showError(error.message || 'Error'); return; }
      alert(t('auth.success.register')); document.getElementById('input-password').value = ''; switchToLogin();
    }
  } catch(err) { console.error(err); authBtn.disabled = false; authBtn.style.opacity = '1'; showError(t('auth.error.unexpected') + (err?.message || err)); }
}

function setupAccountStatusListener(aid) {
  const c = getSupabase(); if (!c) return;
  if (userStatusSubscription) { c.removeChannel(userStatusSubscription); userStatusSubscription = null; }
  userStatusSubscription = c.channel(`ban_${aid}`).on('postgres_changes', { event:'UPDATE', schema:'public', table:'account_requests', filter:`id=eq.${aid}` }, p => { if (p.new.status === 'rejected') { alert('Banned!'); window.location.reload(); } }).subscribe();
}
function setupRequestSubscription() {
  const c = getSupabase(); if (!c || !currentUser) return;
  if (requestSubscription) { c.removeChannel(requestSubscription); requestSubscription = null; }
  requestSubscription = c.channel(`req_${currentUser}`).on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_requests', filter:`receiver=eq.${currentUser}` }, () => loadIncomingRequests()).subscribe();
}
function startUsageHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(async () => {
    if (document.visibilityState !== 'visible' || !currentAccountData) return;
    const c = getSupabase(); if (!c) return;
    const us = (currentAccountData.usage_seconds || 0) + 5; currentAccountData.usage_seconds = us;
    await c.from('account_requests').update({ usage_seconds: us, session_updated_at: new Date().toISOString() }).eq('id', currentAccountData.id);
  }, 5000);
}
function updateChatUserStatus() {
  const el = document.getElementById('chat-user-status'); if (!el || !currentChatFriend) return;
  const on = onlineUsers.has(currentChatFriend); el.classList.toggle('online', on); el.classList.toggle('offline', !on);
  const te = el.querySelector('.status-text'); if (te) te.innerText = on ? t('chat.online') : t('chat.offline');
}
function refreshOnlineUsersFromPresence() { if (!presenceChannel) return; const s = presenceChannel.presenceState(); onlineUsers = new Set(Object.keys(s)); updateChatUserStatus(); }
async function startOnlinePresence() {
  const c = getSupabase(); if (!c || !currentUser) return;
  if (presenceChannel) { try { await c.removeChannel(presenceChannel); } catch(e){} presenceChannel = null; }
  onlineUsers = new Set();
  presenceChannel = c.channel('online', { config: { presence: { key: currentUser } } });
  presenceChannel.on('presence', {event:'sync'}, refreshOnlineUsersFromPresence).on('presence', {event:'join'}, refreshOnlineUsersFromPresence).on('presence', {event:'leave'}, refreshOnlineUsersFromPresence)
    .subscribe(async st => { if (st === 'SUBSCRIBED') await presenceChannel.track({ user: currentUser, online_at: new Date().toISOString() }); });
}

async function loadRecentChats() {
  if (!currentUser) return; const c = getSupabase(); if (!c) return;
  const friends = new Set();
  const { data: reqs } = await c.from('chat_requests').select('*').eq('status','accepted').or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);
  if (reqs) reqs.forEach(r => { if (r.sender !== currentUser) friends.add(r.sender); if (r.receiver !== currentUser) friends.add(r.receiver); });
  const { data: msgs } = await c.from('private_messages').select('*').or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);
  if (msgs) msgs.forEach(m => { if (m.sender !== currentUser) friends.add(m.sender); if (m.receiver !== currentUser) friends.add(m.receiver); });
  chatList.innerHTML = '';
  if (friends.size === 0) { chatList.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comments"></i><p>${t('home.no_chats')}</p></div>`; return; }
  const fp = await fetchProfilesFor(Array.from(friends));
  friends.forEach(f => {
    const d = document.createElement('div'); d.className = 'chat-item'; d.onclick = () => openChat(f);
    const p = fp[f], dn = (p && p.display_name) ? p.display_name : f;
    const ai = (p && p.avatar_url) ? `<img class="avatar-img" src="${escapeHtml(p.avatar_url)}" alt="">` : escapeHtml(f.charAt(0).toUpperCase());
    d.innerHTML = `<div class="avatar">${ai}</div><div><h4>${escapeHtml(dn)}</h4></div>`;
    chatList.appendChild(d);
  });
}

async function loadIncomingRequests() {
  const c = getSupabase(); if (!c || !currentUser) return;
  const { data, error } = await c.from('chat_requests').select('*').eq('receiver', currentUser).eq('status','pending');
  if (error) { console.error(error); return; }
  const rb = document.getElementById('req-badge'), rl = document.getElementById('requests-list');
  if (!data || data.length === 0) { rb.style.display = 'none'; rl.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;">${t('home.no_requests')}</div>`; return; }
  rb.style.display = 'block'; rb.innerText = data.length; rl.innerHTML = '';
  data.forEach(r => {
    const i = document.createElement('div');
    i.style.cssText = 'display:flex;justify-content:space-between;align-items:center;background:var(--bg-main);padding:10px 15px;border-radius:12px;border:1px solid var(--glass-border);gap:10px;';
    i.innerHTML = `<div><h4 style="font-size:.95rem;color:var(--text-main);">${escapeHtml(r.sender)}</h4><span style="font-size:.75rem;color:var(--text-muted);">${t('requests.wants')}</span></div><div style="display:flex;gap:8px;"><button type="button" class="accept-request" data-id="${r.id}" data-sender="${escapeHtml(r.sender)}" style="background:#22c55e;color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:.8rem;">${t('requests.accept')}</button><button type="button" class="reject-request" data-id="${r.id}" data-sender="${escapeHtml(r.sender)}" style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:.8rem;">${t('requests.reject')}</button></div>`;
    rl.appendChild(i);
  });
}

async function respondToRequest(rid, ns, sn) {
  const c = getSupabase(); if (!c) return;
  const { error } = await c.from('chat_requests').update({ status: ns }).eq('id', rid);
  if (error) { alert('Error: ' + error.message); return; }
  await loadIncomingRequests(); await loadRecentChats(); if (ns === 'accepted') { closeRequestsModal(); openChat(sn); }
}
function openRequestsModal() { document.getElementById('requests-modal').style.display = 'flex'; loadIncomingRequests(); }
function closeRequestsModal() { document.getElementById('requests-modal').style.display = 'none'; }

async function startNewChat() {
  const si = document.getElementById('search-username'), fn = si.value.trim();
  if (!fn) { alert('Enter username!'); return; } if (fn === currentUser) { alert(t('search.self')); return; }
  const c = getSupabase(); if (!c) return;
  const { data: uc, error: ue } = await c.from('account_requests').select('username').eq('username', fn).eq('status','approved').maybeSingle();
  if (ue || !uc) { alert(t('search.not_found')); return; }
  const { data: er } = await c.from('chat_requests').select('*').or(`and(sender.eq.${currentUser},receiver.eq.${fn}),and(sender.eq.${fn},receiver.eq.${currentUser})`).maybeSingle();
  if (er) { if (er.status === 'accepted') { si.value = ''; openChat(fn); return; } if (er.status === 'pending') { alert(t('requests.pending')); return; } if (er.status === 'rejected') { await c.from('chat_requests').update({ status:'pending', sender:currentUser, receiver:fn }).eq('id', er.id); alert(t('requests.sent')); si.value = ''; return; } }
  const { error: ie } = await c.from('chat_requests').insert([{ sender: currentUser, receiver: fn, status: 'pending' }]);
  if (ie) alert('Error: ' + ie.message); else { alert(t('requests.sent')); si.value = ''; }
}

async function openChat(fn) {
  currentChatFriend = fn;
  const ne = document.getElementById('chat-with-name'), ae = document.getElementById('chat-avatar');
  ne.innerText = fn; ae.innerText = (fn || 'U').charAt(0).toUpperCase();
  fetchProfilesFor([fn]).then(pf => { const p = pf[fn]; if (!p || currentChatFriend !== fn) return; if (p.avatar_url) ae.innerHTML = `<img class="avatar-img" src="${escapeHtml(p.avatar_url)}" alt="">`; if (p.display_name) ne.innerText = p.display_name; });
  updateChatUserStatus(); homeScreen.classList.remove('active'); chatScreen.classList.add('active'); chatBox.innerHTML = '';
  msgInput.removeAttribute('readonly'); msgInput.removeAttribute('disabled'); try { msgInput.focus({ preventScroll: true }); } catch(e) { msgInput.focus(); }
  const c = getSupabase(); if (!c) return;
  const { data, error } = await c.from('private_messages').select('*').or(`and(sender.eq.${currentUser},receiver.eq.${currentChatFriend}),and(sender.eq.${currentChatFriend},receiver.eq.${currentUser})`).order('created_at', { ascending: true });
  if (error) { console.error(error); chatBox.innerHTML = `<div style="text-align:center;color:#ff4d4d;margin-top:20px;">${t('chat.error.load')}</div>`; }
  else if (data && data.length > 0) { data.forEach(addMessageToScreen); settleAndScroll(); }
  else { chatBox.innerHTML = `<div style="text-align:center;color:var(--text-muted);margin-top:20px;">${t('chat.empty')} ${escapeHtml(currentChatFriend)}!</div>`; }
  if (messageSubscription) c.removeChannel(messageSubscription);
  messageSubscription = c.channel(`chat_${currentUser}_${currentChatFriend}`).on('postgres_changes', { event:'INSERT', schema:'public', table:'private_messages' }, p => {
    const m = p.new; if ((m.sender === currentUser && m.receiver === currentChatFriend) || (m.sender === currentChatFriend && m.receiver === currentUser)) { const ph = chatBox.querySelector('.empty-chat-message'); if (ph) ph.remove(); addMessageToScreen(m); }

  if (t.closest('#chat-back-btn')) { currentChatFriend = ''; if (messageSubscription) { const c = getSupabase(); if (c) c.removeChannel(messageSubscription); messageSubscription = null; } chatScreen.classList.remove('active'); homeScreen.classList.add('active'); loadRecentChats(); return; }
  if (t.closest('#send-btn')) { sendMessage(); return; }
  if (t.closest('.modal')) { if (!t.closest('.modal-content')) t.closest('.modal').style.display = 'none'; return; }
  if (!t.closest('#theme-picker') && !t.closest('.theme-toggle-btn')) closeThemePicker();
  if (!t.closest('#attachment-menu') && !t.closest('#attach-btn')) closeAttachmentMenu();
});

document.addEventListener('change', e => {
  if (e.target.id === 'profile-avatar-input') { const f = e.target.files?.[0]; if (f) uploadProfileAvatar(f); }
  if (e.target.id === 'documents-input') { const f = e.target.files?.[0]; if (f) uploadAndSendFile(f); }
  if (e.target.id === 'camera-input') { const f = e.target.files?.[0]; if (f) uploadAndSendFile(f); }
  if (e.target.id === 'gallery-input') { const f = e.target.files?.[0]; if (f) uploadAndSendFile(f); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { if (document.activeElement === msgInput) { e.preventDefault(); sendMessage(); } }
  if (e.key === 'Escape') { closeThemePicker(); closeAttachmentMenu(); closeSettings(); closeRequestsModal(); closePollModal(); }
});

if (msgInput) { msgInput.addEventListener('input', handleMessageInput); msgInput.addEventListener('focus', () => { if (chatScreen.classList.contains('active')) { requestAnimationFrame(() => settleAndScroll()); } }); }
if (authBtn) authBtn.addEventListener('click', handleAuthAction);
document.getElementById('input-passcode')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleAuthAction(); } });
document.getElementById('input-password')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleAuthAction(); } });
document.getElementById('search-username')?.addEventListener('keydown', e => { if (e.key === 'Enter') startNewChat(); });

window.addEventListener('beforeunload', () => { if (currentAccountData?.id) { const c = getSupabase(); if (c) c.from('account_requests').update({ session_id: null }).eq('id', currentAccountData.id).then(() => {}); } });
window.addEventListener('visibilitychange', () => { const s = document.getElementById('privacy-shield'); if (!s) return; if (document.visibilityState === 'hidden') s.classList.add('show'); else setTimeout(() => s.classList.remove('show'), 250); });

function initApp() { initTheme(); initFont(); initLanguage(); updateAuthUI(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp); else initApp();
</script>
</body>
</html>
