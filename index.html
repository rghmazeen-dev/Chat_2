<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Private Chat App / تطبيق المحادثات الخاصة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root[data-theme="crimson"] {
      --bg-main:#0b090a;
      --bg-radial:radial-gradient(circle at top right,#1a080c,#0b090a 60%);
      --card-bg:#161a1d;
      --accent-color:#e63946;
      --accent-gradient:linear-gradient(135deg,#d90429 0%,#ef233c 50%,#800020 100%);
      --glass-border:rgba(255,255,255,.08);
      --text-main:#f8fafc;
      --text-muted:#b1a7a6;
      --glow-effect:0 0 20px rgba(230,57,70,.35);
      --msg-me-shadow:0 4px 15px rgba(217,4,41,.35);
    }

    :root[data-theme="neon"] {
      --bg-main:#030712;
      --bg-radial:radial-gradient(circle at top right,#002b53 0%,#030712 65%);
      --card-bg:#0b1528;
      --accent-color:#00f0ff;
      --accent-gradient:linear-gradient(135deg,#00f0ff 0%,#0072ff 50%,#002b80 100%);
      --glass-border:rgba(0,240,255,.15);
      --text-main:#f0f9ff;
      --text-muted:#94a3b8;
      --glow-effect:0 0 25px rgba(0,240,255,.4);
      --msg-me-shadow:0 4px 15px rgba(0,114,255,.4);
    }

    :root[data-theme="mono"] {
      --bg-main:#080808;
      --bg-radial:radial-gradient(circle at top right,#252525 0%,#0d0d0d 45%,#050505 100%);
      --card-bg:#171717;
      --accent-color:#f5f5f5;
      --accent-gradient:linear-gradient(135deg,#ffffff 0%,#bdbdbd 48%,#555555 100%);
      --glass-border:rgba(255,255,255,.13);
      --text-main:#fafafa;
      --text-muted:#a3a3a3;
      --glow-effect:0 0 22px rgba(255,255,255,.18);
      --msg-me-shadow:0 4px 15px rgba(255,255,255,.12);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Cairo',-apple-system,sans-serif;
    }

    html,body {
      width:100%;
      height:100%;
      min-height:100vh;
      overflow:hidden;
      background:var(--bg-main);
      color:var(--text-main);
    }

    button,input { font:inherit; }

    .screen {
      display:none;
      width:100vw;
      height:100dvh;
      min-height:100vh;
      flex-direction:column;
      background:var(--bg-radial);
      position:relative;
    }

    .screen.active { display:flex; }

    .back-btn-absolute {
      position:absolute;
      top:20px;
      left:20px;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      color:var(--text-main);
      width:40px;
      height:40px;
      border-radius:50%;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:20;
    }

    .back-btn-absolute:hover {
      border-color:var(--accent-color);
      color:var(--accent-color);
    }

    .auth-container {
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
    }

    .auth-container i {
      font-size:3.8rem;
      color:var(--accent-color);
      margin-bottom:20px;
      filter:drop-shadow(var(--glow-effect));
    }

    .auth-container h2 {
      margin-bottom:10px;
      font-size:1.6rem;
    }

    .auth-container p {
      color:var(--text-muted);
      margin-bottom:20px;
      font-size:.95rem;
    }

    .auth-input-wrapper {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:20px;
      padding:10px 20px;
      display:flex;
      width:100%;
      max-width:380px;
      margin-bottom:12px;
    }

    .auth-input-wrapper input {
      flex:1;
      background:transparent;
      border:none;
      color:#fff;
      outline:none;
      font-size:.95rem;
      text-align:center;
      min-width:0;
    }

    .primary-btn {
      background:var(--accent-gradient);
      color:#fff;
      border:none;
      padding:12px 30px;
      border-radius:20px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:var(--msg-me-shadow);
      width:100%;
      max-width:380px;
      margin-top:5px;
      -webkit-tap-highlight-color:transparent;
    }

    .primary-btn:active { transform:scale(.98); }

    .secondary-link {
      color:var(--text-muted);
      margin-top:15px;
      cursor:pointer;
      font-size:.85rem;
      text-decoration:underline;
    }

    .error-msg {
      color:#ff4d4d;
      background:rgba(255,77,77,.1);
      border:1px solid rgba(255,77,77,.3);
      padding:10px;
      border-radius:12px;
      font-size:.85rem;
      width:100%;
      max-width:380px;
      margin-bottom:15px;
      display:none;
      text-align:center;
      word-break:break-word;
    }

    .header {
      padding:12px 16px;
      padding-top:max(12px,env(safe-area-inset-top));
      border-bottom:1px solid var(--glass-border);
      background-color:rgba(3,7,18,.78);
      backdrop-filter:blur(14px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
      flex:0 0 auto;
    }

    .header h3 { font-size:1.1rem; }

    .chat-header-main {
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
    }

    .chat-back {
      flex:0 0 auto;
      font-size:1.15rem;
      cursor:pointer;
      padding:6px;
    }

    .chat-avatar {
      width:42px;
      height:42px;
      flex:0 0 42px;
      border-radius:50%;
      background:var(--accent-gradient);
      border:2px solid var(--accent-color);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:1.05rem;
      font-weight:800;
      box-shadow:var(--glow-effect);
    }

    .chat-user-info {
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      line-height:1.15;
    }

    .chat-user-name {
      font-size:1rem;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:48vw;
    }

    .chat-user-status {
      color:var(--text-muted);
      font-size:.72rem;
      margin-top:4px;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:5px;
    }

    .status-dot {
      width:7px;
      height:7px;
      border-radius:50%;
      display:inline-block;
      flex:0 0 7px;
      background:#8b8f98;
    }

    .chat-user-status.online { color:#22c55e; }

    .chat-user-status.online .status-dot {
      background:#22c55e;
      box-shadow:0 0 7px rgba(34,197,94,.65);
    }

    .chat-user-status.offline .status-dot { background:#8b8f98; }

    .chat-header-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .chat-header-icon {
      width:34px;
      height:34px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:var(--text-muted);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:1rem;
    }

    .chat-header-icon:hover {
      color:var(--accent-color);
      background:rgba(255,255,255,.06);
    }

    .chat-theme-small {
      width:30px;
      height:30px;
      font-size:.78rem;
      border:1px solid var(--glass-border);
      background:var(--card-bg);
      color:var(--accent-color);
    }

    .search-bar {
      padding:15px 20px;
      display:flex;
      gap:10px;
      border-bottom:1px solid var(--glass-border);
      flex:0 0 auto;
    }

    .search-bar input {
      flex:1;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:15px;
      padding:10px 15px;
      color:#fff;
      outline:none;
      font-size:.9rem;
      min-width:0;
    }

    .search-bar button {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      color:var(--accent-color);
      padding:10px 15px;
      border-radius:15px;
      cursor:pointer;
      font-weight:bold;
      font-size:.9rem;
      white-space:nowrap;
    }

    .chat-list {
      flex:1;
      overflow-y:auto;
      padding:10px;
    }

    .empty-state {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100%;
      color:var(--text-muted);
      opacity:.7;
      text-align:center;
    }

    .empty-state i {
      font-size:3rem;
      margin-bottom:15px;
    }

    .chat-item {
      display:flex;
      align-items:center;
      gap:15px;
      padding:15px;
      background:var(--card-bg);
      border-radius:15px;
      margin-bottom:10px;
      cursor:pointer;
      border:1px solid transparent;
    }

    .chat-item:hover {
      border-color:var(--accent-color);
      background:rgba(22,26,29,.9);
    }

    .chat-item .avatar {
      width:45px;
      height:45px;
      border-radius:50%;
      background:var(--accent-gradient);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:1.2rem;
      color:#fff;
      flex:0 0 45px;
    }

    .chat-box {
      flex:1;
      min-height:0;
      padding:20px 20px calc(var(--composer-height, 105px) + 20px);
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      overscroll-behavior:contain;
    }

    .msg-group {
      display:flex;
      flex-direction:column;
      margin-bottom:12px;
      width:fit-content;
      max-width:75%;
      position:relative;
      min-width:0;
    }

    .msg-group.me { align-self:flex-end; }
    .msg-group.other { align-self:flex-start; }

    .bubble {
      padding:12px 18px;
      border-radius:20px;
      font-size:.95rem;
      line-height:1.55;
      word-break:break-word;
      overflow-wrap:anywhere;
      white-space:pre-wrap;
      direction:rtl;
      text-align:right;
      unicode-bidi:plaintext;
      max-width:100%;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      cursor:default;
    }

    .message-actions,
    .emoji-picker {
      display:none !important;
    }

    .message-actions {
      display:none;
      position:absolute;
      bottom:calc(100% + 6px);
      right:0;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:6px;
      gap:4px;
      z-index:50;
      box-shadow:var(--glow-effect);
      white-space:nowrap;
    }

    .msg-group.show-actions .message-actions { display:flex; }

    .message-actions button {
      border:none;
      background:transparent;
      cursor:pointer;
      font-size:1.2rem;
      padding:5px;
      border-radius:10px;
      color:var(--text-main);
    }

    .message-actions button:hover { background:rgba(255,255,255,.08); }

    .reaction-more {
      font-size:1.1rem !important;
      color:var(--text-main);
    }

    .emoji-picker {
      display:none;
      position:absolute;
      bottom:calc(100% + 6px);
      right:0;
      width:min(310px,88vw);
      max-height:220px;
      overflow-y:auto;
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:10px;
      grid-template-columns:repeat(8,1fr);
      gap:5px;
      z-index:60;
      box-shadow:var(--glow-effect);
    }

    .emoji-picker.show { display:grid; }

    .emoji-picker button {
      border:0;
      background:transparent;
      font-size:1.35rem;
      padding:5px;
      cursor:pointer;
      border-radius:9px;
    }

    .emoji-picker button:hover { background:rgba(255,255,255,.08); }

    .reaction-badge {
      display:flex;
      gap:3px;
      margin-top:4px;
      flex-wrap:wrap;
    }

    .reaction-badge span {
      background:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:12px;
      padding:2px 6px;
      font-size:.75rem;
    }

    .msg-group.me .bubble {
      background:rgba(55,55,58,.92);
      color:#fff;
      border-bottom-left-radius:4px;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 3px 12px rgba(0,0,0,.16);
    }

    :root[data-theme="neon"] .msg-group.me .bubble {
      background:rgba(18,35,52,.94);
      border-color:rgba(255,255,255,.10);
    }

    :root[data-theme="mono"] .msg-group.me .bubble {
      background:rgba(58,58,58,.94);
      border-color:rgba(255,255,255,.14);
    }

    .msg-group.other .bubble {
      background:rgba(255,255,255,.07);
      color:var(--text-main);
      border-bottom-right-radius:4px;
      border:1px solid var(--glass-border);
    }

    .msg-time {
      font-size:.65rem;
      opacity:.75;
      margin-top:4px;
      display:block;
      text-align:left;
    }

    .input-container {
      position:fixed;
      left:0;
      right:0;
      bottom:var(--keyboard-offset,0px);
      padding:12px 16px;
      padding-bottom:max(12px,env(safe-area-inset-bottom));
      background-color:rgba(3,7,18,.92);
      border-top:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      gap:12px;
      backdrop-filter:blur(10px);
      z-index:40;
      transition:bottom .12s ease;
    }

    .input-wrapper {
      flex:1;
      background-color:var(--card-bg);
      border:1px solid var(--glass-border);
      border-radius:24px;
      padding:7px 10px;
      display:grid;
      grid-template-columns:34px minmax(0,1fr) 34px;
      align-items:end;
      gap:7px;
      min-width:0;
      direction:ltr;
      overflow:hidden;
      transition:height .12s ease;
    }

    .input-wrapper textarea {
      width:100%;
      min-width:0;
      min-height:34px;
      max-height:132px;
      resize:none;
      overflow-y:auto;
      align-self:center;
      background:transparent;
      border:none;
      color:#fff;
      font-size:.95rem;
      line-height:1.45;
      outline:none;
      padding:6px 2px;
      direction:rtl;
      text-align:right;
      -webkit-user-select:text;
      user-select:text;
      -webkit-tap-highlight-color:transparent;
      font-family:'Cairo', -apple-system, sans-serif;
    }

    .input-wrapper textarea::placeholder {
      color:var(--text-muted);
      opacity:.85;
    }

    .attach-btn {
      grid-column:1;
      grid-row:1;
      width:34px;
      height:34px;
      border:0;
      background:transparent;
      color:var(--text-muted);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.15rem;
      cursor:pointer;
      padding:0;
      transition:color .2s, background .2s, transform .15s;
    }

    .attach-btn:hover {
      color:var(--accent-color);
      background:rgba(255,255,255,.07);
    }

    .attach-btn:active {
      transform:scale(.94);
    }

    .attachment-menu {
      position:fixed;
      right:16px;
      bottom:calc(var(--keyboard-offset,0px) + var(--composer-height,105px) + 10px);
      width:min(250px,calc(100vw - 32px));
      padding:8px;
      background:rgba(18,18,18,.98);
      border:1px solid var(--glass-border);
      border-radius:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.45),var(--glow-effect);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      display:none;
      flex-direction:column;
      gap:5px;
      z-index:220;
    }
    .attachment-menu.show { display:flex; }
    .attachment-option {
      width:100%;
      border:1px solid transparent;
      background:rgba(255,255,255,.045);
      color:var(--text-main);
      border-radius:13px;
      padding:11px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      cursor:pointer;
      text-align:right;
    }
    .attachment-option:hover {
      background:rgba(255,255,255,.09);
      border-color:var(--glass-border);
    }
    .attachment-option i {
      width:30px;
      text-align:center;
      color:var(--accent-color);
      font-size:1.05rem;
    }
    .attachment-option span { flex:1; font-weight:700; font-size:.86rem; }

    /* التعديلات المحسنة لبطاقة الاستطلاع داخل الشات لمنع تداخل النصوص والخطوط */
    .poll-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(100%, 320px);
      min-width: 240px;
      direction: rtl;
    }
    .poll-card-title {
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: right;
      overflow-wrap: anywhere;
      color: inherit;
    }
    .poll-vote-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      cursor: pointer;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .poll-vote-btn:hover { 
      border-color: var(--accent-color); 
      background: rgba(255, 255, 255, 0.09);
    }
    .poll-vote-btn.selected { 
      border-color: var(--accent-color); 
      background: rgba(255, 255, 255, 0.12); 
    }
    .poll-vote-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      width: 100%; 
      gap: 8px; 
    }
    .poll-vote-label { 
      flex: 1;
      text-align: right; 
      direction: rtl; 
      font-size: 0.88rem;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .poll-vote-count { 
      color: var(--text-muted); 
      font-size: 0.78rem; 
      white-space: nowrap; 
      flex: 0 0 auto; 
    }
    .poll-results { 
      color: var(--text-muted); 
      font-size: 0.75rem; 
      text-align: right; 
      margin-top: 2px;
    }

    .send-btn {
      grid-column:3;
      grid-row:1;
      width:34px;
      height:34px;
      color:var(--accent-color);
      font-size:1.3rem;
      cursor:pointer;
      display:none;
      padding:4px;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      -webkit-tap-highlight-color:transparent;
    }

    .send-btn:active { transform:scale(.92); }

    .theme-btn {
      background:transparent;
      border:none;
      color:var(--accent-color);
      font-size:1.2rem;
      cursor:pointer;
      position:relative;
      padding:5px;
    }

    .theme-picker {
      position:fixed;
      top:68px;
      right:16px;
      width:190px;
      padding:10px;
      background:rgba(18,18,18,.97);
      border:1px solid var(--glass-border);
      border-radius:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.45), var(--glow-effect);
      backdrop-filter:blur(16px);
      display:none;
      flex-direction:column;
      gap:7px;
      z-index:250;
    }
    .theme-picker.show { display:flex; }
    .theme-picker-title {
      color:#fff;
      font-size:.82rem;
      font-weight:800;
      padding:4px 8px 7px;
      border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom:2px;
    }
    .theme-option {
      width:100%;
      border:1px solid transparent;
      background:rgba(255,255,255,.045);
      color:#f5f5f5;
      border-radius:13px;
      padding:9px 10px;
      display:flex;
      align-items:center;
      gap:9px;
      cursor:pointer;
      text-align:right;
    }
    .theme-option:hover { background:rgba(255,255,255,.09); }
    .theme-option.active {
      border-color:rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);
    }
    .theme-dot {
      width:23px;
      height:23px;
      flex:0 0 23px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.25);
    }
    .theme-dot.crimson { background:linear-gradient(135deg,#ef233c,#800020); }
    .theme-dot.neon { background:linear-gradient(135deg,#00f0ff,#0072ff); }
    .theme-dot.mono { background:linear-gradient(135deg,#fff,#bdbdbd 50%,#333); }
    .theme-option-name { flex:1; font-size:.82rem; font-weight:700; }
    .theme-option-check { opacity:0; font-size:.8rem; }
    .theme-option.active .theme-option-check { opacity:1; }

    .modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.8);
      z-index:100;
      align-items:center;
      justify-content:center;
      backdrop-filter:blur(5px);
    }
    .modal-content {
      background:var(--card-bg);
