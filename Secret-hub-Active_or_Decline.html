<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Hub - Admin Panel</title>
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b090a; 
      --card-bg: #161a1d; 
      --accent-color: #e63946;
      --accent-gradient: linear-gradient(135deg, #d90429 0%, #ef233c 50%, #800020 100%);
      --glass-border: rgba(255, 255, 255, 0.08); 
      --text-main: #f8fafc; 
      --text-muted: #b1a7a6;
      --success-color: #2a9d8f;
      --warning-color: #e9c46a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    /* Login Box */
    #admin-login-box { 
      background: var(--card-bg); 
      border: 1px solid var(--glass-border); 
      padding: 40px 25px; 
      border-radius: 20px; 
      text-align: center; 
      max-width: 420px; 
      margin: 80px auto; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #admin-login-box h2 { color: var(--accent-color); margin-bottom: 8px; font-size: 1.8rem; }
    #admin-login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; }
    
    .input-wrap { 
      background: var(--bg-main); 
      border: 1px solid var(--glass-border); 
      border-radius: 15px; 
      padding: 12px 15px; 
      margin-bottom: 15px; 
    }
    .input-wrap input { 
      width: 100%; 
      background: transparent; 
      border: none; 
      color: #fff; 
      outline: none; 
      text-align: center; 
      font-size: 1rem; 
    }
    
    .btn { 
      background: var(--accent-gradient); 
      color: #fff; 
      border: none; 
      padding: 12px 25px; 
      border-radius: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      width: 100%; 
      font-size: 1rem; 
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }

    /* Main Dashboard */
    #admin-panel { display: none; }
    
    .header-panel { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
      padding-bottom: 15px; 
      border-bottom: 1px solid var(--glass-border); 
    }
    .header-panel h2 { color: var(--accent-color); font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
    .exit-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-muted); padding: 8px 16px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .exit-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

    /* Stats Overview */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 18px 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .stat-icon.active-icon { background: rgba(42, 157, 143, 0.15); color: var(--success-color); }
    .stat-icon.pending-icon { background: rgba(233, 196, 106, 0.15); color: var(--warning-color); }
    .stat-info h3 { font-size: 1.4rem; color: #fff; }
    .stat-info p { font-size: 0.8rem; color: var(--text-muted); }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { 
      flex: 1; 
      padding: 12px; 
      background: var(--card-bg); 
      border: 1px solid var(--glass-border); 
      color: var(--text-muted); 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 600; 
      text-align: center; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.3s;
    }
    .tab-btn.active { 
      background: var(--accent-gradient); 
      color: #fff; 
      border-color: transparent; 
      box-shadow: 0 4px 15px rgba(217, 4, 41, 0.3);
    }

    /* Cards List */
    .request-card { 
      background: var(--card-bg); 
      border: 1px solid var(--glass-border); 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 15px;
      flex-wrap: wrap;
    }
    .request-info { flex: 1; min-width: 280px; }
    .request-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .request-info h4 { font-size: 1.15rem; color: #fff; }
    
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-active { background: rgba(42, 157, 143, 0.2); color: var(--success-color); border: 1px solid rgba(42, 157, 143, 0.4); }
    .badge-pending { background: rgba(233, 196, 106, 0.2); color: var(--warning-color); border: 1px solid rgba(233, 196, 106, 0.4); }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .detail-item { display: flex; align-items: center; gap: 6px; }
    .detail-item strong { color: #fff; }

    /* Timer Badges */
    .duration-tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      padding: 5px 10px;
      border-radius: 8px;
      color: #f1faee;
      font-weight: 500;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .duration-tag.membership { border-color: rgba(69, 123, 157, 0.4); color: #a8dadc; }
    .duration-tag.usage { border-color: rgba(230, 57, 70, 0.4); color: #ffb703; }
    
    .actions { display: flex; gap: 10px; }
    .approve-btn { background: #2a9d8f; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .reject-btn { background: #e63946; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .approve-btn:hover { background: #238579; }
    .reject-btn:hover { background: #d0303d; }
    
    .error-txt { color: #e63946; margin-bottom: 15px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Admin Login Screen -->
    <div id="admin-login-box">
      <i class="fa-solid fa-user-shield" style="font-size: 3.5rem; color: var(--accent-color); margin-bottom: 15px;"></i>
      <h2>Secret Hub</h2>
      <p>Enter Admin Passcode to access Control Panel</p>
      
      <div class="error-txt" id="login-error">Incorrect Admin Passcode!</div>
      
      <div class="input-wrap">
        <input type="password" id="admin-pass-input" placeholder="Admin Passcode..." onkeypress="if(event.key==='Enter') checkAdminLogin()">
      </div>
      <button class="btn" onclick="checkAdminLogin()">Access Dashboard</button>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-panel">
      <div class="header-panel">
        <h2><i class="fa-solid fa-shield-halved"></i> Secret Hub Dashboard</h2>
        <button class="exit-btn" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon active-icon"><i class="fa-solid fa-user-check"></i></div>
          <div class="stat-info">
            <h3 id="stat-active-count">0</h3>
            <p>Active Accounts</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon pending-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <div class="stat-info">
            <h3 id="stat-pending-count">0</h3>
            <p>Pending Requests</p>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <div class="tab-btn active" id="tab-approved" onclick="switchTab('approved')">
          <i class="fa-solid fa-users"></i> Active Accounts
        </div>
        <div class="tab-btn" id="tab-pending" onclick="switchTab('pending')">
          <i class="fa-solid fa-user-clock"></i> Pending Requests
        </div>
      </div>

      <!-- Accounts / Requests Container -->
      <div id="requests-container">
        <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading data...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2dnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';
    
    let _supabase = null;
    function getSupabase() {
      if (!_supabase && window.supabase) {
        _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return _supabase;
    }

    const ADMIN_SECRET_PASS = "2411712";
    let currentTab = 'approved';
    let autoRefreshTimer = null;

    function checkAdminLogin() {
      const val = document.getElementById('admin-pass-input').value.trim();
      if (val === ADMIN_SECRET_PASS) {
        document.getElementById('admin-login-box').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadStats();
        loadData();
        initRealtime();
        
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        autoRefreshTimer = setInterval(() => {
          if (document.getElementById('admin-panel').style.display === 'block') {
            loadData(false);
          }
        }, 1000);
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('admin-login-box').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('admin-pass-input').value = '';
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-approved').className = `tab-btn ${tab === 'approved' ? 'active' : ''}`;
      document.getElementById('tab-pending').className = `tab-btn ${tab === 'pending' ? 'active' : ''}`;
      loadData();
    }

    function getMembershipTime(dateString) {
      if (!dateString) return "0s";
      const createdDate = new Date(dateString);
      const now = new Date();
      const diffMs = Math.max(0, now - createdDate);
      return formatSeconds(Math.floor(diffMs / 1000));
    }

    function formatSeconds(totalSeconds) {
      if (!totalSeconds || isNaN(totalSeconds)) return "0s";
      
      const days = Math.floor(totalSeconds / (3600 * 24));
      const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      
      let parts = [];
      if (days > 0) parts.push(`${days}d`);
      if (hours > 0 || days > 0) parts.push(`${hours}h`);
      if (mins > 0 || hours > 0 || days > 0) parts.push(`${mins}m`);
      parts.push(`${secs}s`);
      
      return parts.join(' ');
    }

    async function loadStats() {
      const client = getSupabase();
      if (!client) return;

      const { data } = await client.from('account_requests').select('status');
      if (data) {
        const active = data.filter(d => d.status === 'approved').length;
        const pending = data.filter(d => d.status === 'pending').length;
        document.getElementById('stat-active-count').innerText = active;
        document.getElementById('stat-pending-count').innerText = pending;
      }
    }

    async function loadData(showLoading = true) {
      const client = getSupabase();
      const container = document.getElementById('requests-container');
      
      if (!client) {
        if (showLoading) {
          container.innerHTML = '<p style="text-align:center; color:#e63946; padding:30px;">Connecting to server...</p>';
        }
        setTimeout(() => loadData(showLoading), 1000);
        return;
      }

      if (showLoading) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading accounts...</p>';
      }

      const { data, error } = await client
        .from('account_requests')
        .select('*')
        .eq('status', currentTab)
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="text-align:center; color: #e63946; padding: 30px;">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        const label = currentTab === 'approved' ? 'active accounts' : 'pending requests';
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 30px;">No ${label} found.</p>`;
        return;
      }

      container.innerHTML = '';
      data.forEach(req => {
        const card = document.createElement('div');
        card.className = 'request-card';
        
        const membershipStr = getMembershipTime(req.created_at);
        const usageStr = formatSeconds(req.usage_seconds || 0);
        
        let actionButtons = '';
        if (currentTab === 'pending') {
          actionButtons = `
            <button class="approve-btn" onclick="updateStatus(${req.id}, 'approved')"><i class="fa-solid fa-check"></i> Approve</button>
            <button class="reject-btn" onclick="updateStatus(${req.id}, 'rejected')"><i class="fa-solid fa-ban"></i> Reject</button>
          `;
        } else {
          actionButtons = `
            <button class="reject-btn" onclick="updateStatus(${req.id}, 'rejected')"><i class="fa-solid fa-ban"></i> Ban</button>
          `;
        }

        const badgeHTML = currentTab === 'approved' 
          ? `<span class="badge badge-active"><i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> Active</span>`
          : `<span class="badge badge-pending"><i class="fa-solid fa-clock" style="font-size:0.5rem;"></i> Pending</span>`;

        card.innerHTML = `
          <div class="request-info">
            <div class="request-header">
              <h4>${req.username}</h4>
              ${badgeHTML}
            </div>
            <div class="detail-row">
              <div class="detail-item"><i class="fa-solid fa-user"></i> User: <strong>${req.username}</strong></div>
              <div class="detail-item"><i class="fa-solid fa-key"></i> Pass: <strong>${req.password}</strong></div>
            </div>
            <div class="detail-row">
              <div class="detail-item">
                <span class="duration-tag membership" title="Membership Time"><i class="fa-solid fa-id-card"></i> Membership: ${membershipStr}</span>
              </div>
              <div class="detail-item">
                <span class="duration-tag usage" title="Active Usage Time"><i class="fa-solid fa-stopwatch"></i> Usage: ${usageStr}</span>
              </div>
            </div>
          </div>
          <div class="actions">
            ${actionButtons}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function updateStatus(id, newStatus) {
      const client = getSupabase();
      if (!client) return;

      const { error } = await client
        .from('account_requests')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert("Error: " + error.message);
      } else {
        loadStats();
        loadData();
      }
    }

    function initRealtime() {
      const client = getSupabase();
      if (!client) return;

      client
        .channel('admin_realtime_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'account_requests' }, () => {
          loadStats();
          loadData(false);
        })
        .subscribe();
    }
  </script>
</body>
    </html>
