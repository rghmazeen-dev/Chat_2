<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المسؤول - طلبات الحسابات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b090a; --card-bg: #161a1d; --accent-color: #e63946;
      --accent-gradient: linear-gradient(135deg, #d90429 0%, #ef233c 50%, #800020 100%);
      --glass-border: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-muted: #b1a7a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    h2 { text-align: center; margin-bottom: 25px; color: var(--accent-color); font-size: 2rem; }
    
    /* شاشة تسجيل دخول الأدمين */
    #admin-login-box { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; margin: 100px auto; }
    .input-wrap { background: var(--bg-main); border: 1px solid var(--glass-border); border-radius: 15px; padding: 12px; margin-bottom: 15px; }
    .input-wrap input { width: 100%; background: transparent; border: none; color: #fff; outline: none; text-align: center; font-size: 1.1rem; }
    .btn { background: var(--accent-gradient); color: #fff; border: none; padding: 12px 25px; border-radius: 15px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
    
    /* جدول الطلبات */
    #admin-panel { display: none; }
    .request-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 15px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .request-info h4 { font-size: 1.2rem; margin-bottom: 5px; }
    .request-info p { color: var(--text-muted); font-size: 0.9rem; }
    .actions { display: flex; gap: 10px; }
    .approve-btn { background: #2a9d8f; color: #fff; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .reject-btn { background: #e63946; color: #fff; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .error-txt { color: #e63946; margin-bottom: 15px; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة تسجيل دخول الأدمين بكلمة السر الخاصة بك -->
    <div id="admin-login-box">
      <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 15px;"></i>
      <h2>لوحة التحكم</h2>
      <div class="error-txt" id="login-error">كلمة مرور الأدمين غير صحيحة!</div>
      <div class="input-wrap">
        <input type="password" id="admin-pass-input" placeholder="أدخل كلمة مرور الأدمين...">
      </div>
      <button class="btn" onclick="checkAdminLogin()">دخول لوحة التحكم</button>
    </div>

    <!-- لوحة عرض الطلبات المعلقة -->
    <div id="admin-panel">
      <h2>طلبات إنشاء الحسابات المعلقة</h2>
      <div id="requests-container">
        <p style="text-align: center; color: var(--text-muted);">جاري تحميل الطلبات...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2vnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // كلمة المرور الخاصة بك لدخول صفحة الأدمن (يمكنك تغييرها لأي كلمة تريدها)
    const ADMIN_SECRET_PASS = "2411712";

    function checkAdminLogin() {
      const val = document.getElementById('admin-pass-input').value.trim();
      if (val === ADMIN_SECRET_PASS) {
        document.getElementById('admin-login-box').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadPendingRequests();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    async function loadPendingRequests() {
      const container = document.getElementById('requests-container');
      const { data, error } = await _supabase
        .from('account_requests')
        .select('*')
        .eq('status', 'pending');

      if (error || !data || data.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">لا توجد طلبات جديدة معلقة حالياً.</p>';
        return;
      }

      container.innerHTML = '';
      data.forEach(req => {
        const card = document.createElement('div');
        card.className = 'request-card';
        card.innerHTML = `
          <div class="request-info">
            <h4>يوزر نيم: ${req.username}</h4>
            <p>كلمة المرور: ${req.password}</p>
          </div>
          <div class="actions">
            <button class="approve-btn" onclick="updateStatus(${req.id}, 'approved')">موافقة</button>
            <button class="reject-btn" onclick="updateStatus(${req.id}, 'rejected')">رفض</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function updateStatus(id, newStatus) {
      const { error } = await _supabase
        .from('account_requests')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert("حدث خطأ أثناء تحديث حالة الطلب");
      } else {
        loadPendingRequests(); // تحديث القائمة فوراً
      }
    }
  </script>
</body>
</html>
