<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Hub - Admin Panel</title>
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b090a; 
      --card-bg: #161a1d; 
      --accent-color: #e63946;
      --accent-gradient: linear-gradient(135deg, #d90429 0%, #ef233c 50%, #800020 100%);
      --glass-border: rgba(255, 255, 255, 0.08); 
      --text-main: #f8fafc; 
      --text-muted: #b1a7a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Login Box */
    #admin-login-box { 
      background: var(--card-bg); 
      border: 1px solid var(--glass-border); 
      padding: 35px 25px; 
      border-radius: 20px; 
      text-align: center; 
      max-width: 400px; 
      margin: 80px auto; 
    }
    #admin-login-box h2 { color: var(--accent-color); margin-bottom: 10px; font-size: 1.8rem; }
    #admin-login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
    
    .input-wrap { 
      background: var(--bg-main); 
      border: 1px solid var(--glass-border); 
      border-radius: 15px; 
      padding: 12px; 
      margin-bottom: 15px; 
    }
    .input-wrap input { 
      width: 100%; 
      background: transparent; 
      border: none; 
      color: #fff; 
      outline: none; 
      text-align: center; 
      font-size: 1rem; 
    }
    
    .btn { 
      background: var(--accent-gradient); 
      color: #fff; 
      border: none; 
      padding: 12px 25px; 
      border-radius: 15px; 
      font-weight: bold; 
      cursor: pointer; 
      width: 100%; 
      font-size: 1rem; 
    }
    .btn:active { transform: scale(0.98); }

    /* Main Dashboard */
    #admin-panel { display: none; }
    .header-panel { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 25px; 
      padding-bottom: 15px; 
      border-bottom: 1px solid var(--glass-border); 
    }
    .header-panel h2 { color: var(--accent-color); font-size: 1.6rem; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { 
      flex: 1; 
      padding: 10px; 
      background: var(--card-bg); 
      border: 1px solid var(--glass-border); 
      color: var(--text-muted); 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 600; 
      text-align: center; 
    }
    .tab-btn.active { 
      background: var(--accent-gradient); 
      color: #fff; 
      border-color: transparent; 
    }

    .request-card { 
      background: var(--card-bg); 
      border: 1px solid var(--glass-border); 
      border-radius: 15px; 
      padding: 18px 20px; 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .request-info h4 { font-size: 1.05rem; color: #fff; margin-bottom: 4px; }
    .request-info p { color: var(--text-muted); font-size: 0.85rem; }
    
    .actions { display: flex; gap: 8px; }
    .approve-btn { background: #2a9d8f; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .reject-btn { background: #e63946; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    
    .error-txt { color: #e63946; margin-bottom: 15px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Admin Login Screen -->
    <div id="admin-login-box">
      <i class="fa-solid fa-user-shield" style="font-size: 3.5rem; color: var(--accent-color); margin-bottom: 15px;"></i>
      <h2>Secret Hub</h2>
      <p>Enter Admin Password to access Control Panel</p>
      
      <div class="error-txt" id="login-error">Incorrect Admin Password!</div>
      
      <div class="input-wrap">
        <input type="password" id="admin-pass-input" placeholder="Admin Passcode..." onkeypress="if(event.key==='Enter') checkAdminLogin()">
      </div>
      <button class="btn" onclick="checkAdminLogin()">Access Dashboard</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
      <div class="header-panel">
        <h2><i class="fa-solid fa-shield-halved"></i> Secret Hub Dashboard</h2>
        <button onclick="logoutAdmin()" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
      </div>

      <div class="tabs">
        <div class="tab-btn active" id="tab-pending" onclick="switchTab('pending')">Pending Requests</div>
        <div class="tab-btn" id="tab-approved" onclick="switchTab('approved')">Approved Users</div>
      </div>

      <div id="requests-container">
        <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading data...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2dnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';
    
    let _supabase = null;
    function getSupabase() {
      if (!_supabase && window.supabase) {
        _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return _supabase;
    }

    const ADMIN_SECRET_PASS = "2411712";
    let currentTab = 'pending';

    function checkAdminLogin() {
      const val = document.getElementById('admin-pass-input').value.trim();
      if (val === ADMIN_SECRET_PASS) {
        document.getElementById('admin-login-box').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadData();
        initRealtime();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('admin-login-box').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('admin-pass-input').value = '';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-pending').className = `tab-btn ${tab === 'pending' ? 'active' : ''}`;
      document.getElementById('tab-approved').className = `tab-btn ${tab === 'approved' ? 'active' : ''}`;
      loadData();
    }

    async function loadData() {
      const client = getSupabase();
      const container = document.getElementById('requests-container');
      
      if (!client) {
        container.innerHTML = '<p style="text-align:center; color:#e63946; padding:30px;">Connecting to Supabase... Please try again in 3 seconds.</p>';
        setTimeout(loadData, 2000);
        return;
      }

      container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading...</p>';

      const { data, error } = await client
        .from('account_requests')
        .select('*')
        .eq('status', currentTab)
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="text-align:center; color: #e63946; padding: 30px;">Database Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 30px;">No ${currentTab} accounts found.</p>`;
        return;
      }

      container.innerHTML = '';
      data.forEach(req => {
        const card = document.createElement('div');
        card.className = 'request-card';
        
        let actionButtons = '';
        if (currentTab === 'pending') {
          actionButtons = `
            <button class="approve-btn" onclick="updateStatus(${req.id}, 'approved')"><i class="fa-solid fa-check"></i> Approve</button>
            <button class="reject-btn" onclick="updateStatus(${req.id}, 'rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
          `;
        } else {
          actionButtons = `
            <button class="reject-btn" onclick="updateStatus(${req.id}, 'rejected')"><i class="fa-solid fa-user-slash"></i> Revoke</button>
          `;
        }

        card.innerHTML = `
          <div class="request-info">
            <h4>User: ${req.username}</h4>
            <p>Pass: ${req.password}</p>
          </div>
          <div class="actions">
            ${actionButtons}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function updateStatus(id, newStatus) {
      const client = getSupabase();
      if (!client) return;

      const { error } = await client
        .from('account_requests')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert("Error: " + error.message);
      } else {
        loadData();
      }
    }

    function initRealtime() {
      const client = getSupabase();
      if (!client) return;

      client
        .channel('admin_realtime_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'account_requests' }, () => {
          loadData();
        })
        .subscribe();
    }
  </script>
</body>
</html>
