<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="crimson-obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن السرية 👑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c080e;
      --accent-primary: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.4);
      --border-line: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #8e8796;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
    .header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border-line); background: rgba(0,0,0,0.5); }
    .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-line); border-radius: 20px; padding: 25px; box-shadow: 0 0 25px var(--accent-glow); }
    input { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border-line); border-radius: 10px; color: #fff; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--accent-primary); border: none; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; }
    .request-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border-line); padding: 12px; border-radius: 10px; margin-bottom: 10px; }
    .btn-approve { background: #28a745; border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .btn-reject { background: #dc3545; border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; margin-right: 4px;}
  </style>
</head>
<body>

  <!-- بوابة حماية الأدمن -->
  <div class="container" id="adminAuthGate">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 15px;">لوحة الأدمن السرية 👑</h2>
      <form id="adminLoginForm">
        <input type="password" id="adminKey" placeholder="أدخل الرمز السري للأدمن..." required>
        <button type="submit" class="btn">فتح اللوحة 🔑</button>
      </form>
    </div>
  </div>

  <!-- لوحة التحكم الحقيقية -->
  <div id="adminPanel" class="hidden">
    <div class="header">
      <h2>لوحة إدارة الموافقات والطلبات المعلقة ⚡</h2>
    </div>
    <div class="container" style="align-items: flex-start;">
      <div class="card">
        <h3 style="margin-bottom: 15px; text-align: center;">الطلبات الجديدة</h3>
        <div id="requestsList"></div>
      </div>
    </div>
  </div>

  <script>
    // كلمة سر حماية اللوحة المستقلة
    const ADMIN_SECRET = "2411712";

    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.getElementById('adminKey').value === ADMIN_SECRET) {
        document.getElementById('adminAuthGate').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadRequests();
      } else {
        alert("❌ الرمز السري غير صحيح!");
      }
    });

    function getUsers() {
      return JSON.parse(localStorage.getItem('app_users') || '[]');
    }

    function saveUsers(users) {
      localStorage.setItem('app_users', JSON.stringify(users));
    }

    function loadRequests() {
      const list = document.getElementById('requestsList');
      const users = getUsers().filter(u => u.status === 'pending');

      if (users.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:var(--text-muted);">لا توجد طلبات معلقة حالياً 🎉</p>`;
        return;
      }

      list.innerHTML = users.map(u => `
        <div class="request-item">
          <div>
            <strong>${u.name}</strong><br>
            <small style="color:var(--text-muted);">@${u.username}</small>
          </div>
          <div>
            <button class="btn-approve" onclick="approve('${u.username}')">قبول ✅</button>
            <button class="btn-reject" onclick="reject('${u.username}')">رفض ❌</button>
          </div>
        </div>
      `).join('');
    }

    window.approve = function(username) {
      const users = getUsers();
      const user = users.find(u => u.username === username);
      if (user) {
        user.status = 'active';
        saveUsers(users);
        loadRequests();
      }
    };

    window.reject = function(username) {
      let users = getUsers();
      users = users.filter(u => u.username !== username);
      saveUsers(users);
      loadRequests();
    };
  </script>
</body>
</html>
